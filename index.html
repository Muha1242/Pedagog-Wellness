<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedagog Wellness</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832;
    --teal-700:#1f5c52;
    --teal-500:#2f8577;
    --teal-400:#4a9b8e;
    --teal-200:#a9d4c9;
    --teal-100:#e2f2ee;
    --cream:#faf8f4;
    --cream-2:#f2efe7;
    --coral:#f2a15a;
    --coral-dark:#e0813a;
    --rose:#e88a7d;
    --ink:#1c2b28;
    --ink-soft:#4c5c58;
    --line: #e4ded2;
    --green-ok:#5c9a72;
    --green-ok-bg:#e9f4ec;
    --amber-ok:#c98a2e;
    --amber-ok-bg:#faf1de;
    --red-ok:#c0654f;
    --red-ok-bg:#fbeae5;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px -12px rgba(18,56,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: var(--shadow);
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 14px 20px;
    background: linear-gradient(180deg, var(--teal-900) 0%, var(--teal-700) 100%);
    color:#fff;
    border-radius: 0 0 26px 26px;
    position:relative;
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:180px;height:180px;
    background: radial-gradient(circle, rgba(242,161,90,0.35), transparent 70%);
  }
  .logo-mark{
    width:44px;height:44px;border-radius:14px;
    background: rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo-mark svg{width:26px;height:26px;}
  header.topbar .titles{position:relative;z-index:1;}
  header.topbar h1{font-size:19px;color:#fff;}
  header.topbar p{margin:2px 0 0 0;font-size:12.5px;color:var(--teal-200);}
  .back-btn{
    background:rgba(255,255,255,0.16);
    border:none;color:#fff;width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:18px;flex-shrink:0;
  }
  main{
    flex:1;
    padding: 18px 18px 100px 18px;
    overflow-y:auto;
  }
  .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.09em;
    color:var(--teal-500);
    font-weight:700;
    margin-bottom:6px;
  }
  .section-title{font-size:22px;margin-bottom:4px;}
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px 0;line-height:1.5;}

  .card{
    background:#fff;
    border-radius: var(--radius);
    padding:18px;
    box-shadow: 0 6px 18px -10px rgba(18,56,50,0.14);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .test-card{
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .test-card:active{transform:scale(0.98);}
  .test-icon{
    width:52px;height:52px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  .test-card h3{font-size:16px;margin-bottom:2px;}
  .test-card p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .chev{margin-left:auto;color:var(--teal-400);font-size:20px;flex-shrink:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background: var(--teal-500);
    color:#fff;border:none;border-radius:14px;
    padding:14px 20px;font-size:15px;font-weight:700;
    cursor:pointer;width:100%;
    font-family:'Manrope',sans-serif;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:hover{background:var(--teal-700);}
  .btn.secondary{
    background:transparent;color:var(--teal-700);border:1.5px solid var(--teal-400);
  }
  .btn.coral{background:var(--coral);}
  .btn.coral:hover{background:var(--coral-dark);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .progress-wrap{margin-bottom:18px;}
  .progress-bar{height:6px;background:var(--cream-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--teal-400),var(--coral));border-radius:6px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-align:right;}

  .question-card{
    background:#fff;border-radius:var(--radius);padding:22px 20px;
    border:1px solid var(--line);margin-bottom:20px;
  }
  .question-text{font-size:16.5px;line-height:1.5;font-weight:600;margin-bottom:20px;}
  .scale-row{display:flex;gap:6px;justify-content:space-between;}
  .scale-btn{
    flex:1;aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    transition:all .12s ease;
  }
  .scale-btn.active{background:var(--teal-500);border-color:var(--teal-500);color:#fff;}
  .scale-caption{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:8px;}

  .option-btn{
    display:block;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;font-size:14.5px;line-height:1.4;
    cursor:pointer;color:var(--ink);font-family:'Manrope',sans-serif;
    transition:all .12s ease;
  }
  .option-btn.selected{border-color:var(--teal-500);background:var(--teal-100);}
  .option-btn.correct{border-color:var(--green-ok);background:var(--green-ok-bg);}
  .option-btn.incorrect{border-color:var(--red-ok);background:var(--red-ok-bg);}

  .result-hero{
    text-align:center;padding:30px 20px 22px 20px;border-radius:var(--radius);
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .result-hero.green{background:linear-gradient(160deg,var(--green-ok-bg),#fff);}
  .result-hero.amber{background:linear-gradient(160deg,var(--amber-ok-bg),#fff);}
  .result-hero.red{background:linear-gradient(160deg,var(--red-ok-bg),#fff);}
  .result-emoji{font-size:44px;margin-bottom:10px;}
  .result-title{font-size:21px;margin-bottom:6px;}
  .result-score{font-size:13px;color:var(--ink-soft);}
  .result-msg{
    background:#fff;border-radius:var(--radius-sm);padding:16px 18px;
    font-size:14.5px;line-height:1.6;color:var(--ink);
    border:1px solid var(--line); margin-bottom:16px;
  }
  .subscale-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .subscale-row:last-child{border-bottom:none;}
  .subscale-name{font-size:13.5px;color:var(--ink-soft);}
  .subscale-bar-wrap{flex:1;margin:0 12px;height:8px;background:var(--cream-2);border-radius:8px;overflow:hidden;}
  .subscale-bar{height:100%;border-radius:8px;background:var(--teal-400);}
  .subscale-val{font-size:13.5px;font-weight:700;width:34px;text-align:right;}

  .bottom-nav{
    position:sticky;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom)) 8px;
    max-width:480px;margin:0 auto;width:100%;
  }
  .nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:10px;
  }
  .nav-btn.active{color:var(--teal-700);}
  .nav-btn svg{width:22px;height:22px;}

  .fitness-icon{background:var(--teal-100);color:var(--teal-700);}
  .fitness-icon.jismoniy{background:#fdeee0;color:var(--coral-dark);}
  .fitness-icon.relaks{background:#f1e8f7;color:#8b5fa3;}
  .fitness-icon.muloqot{background:#e3f2fd;color:#1565c0;}
  .fitness-icon.refleksiya{background:#fff3e0;color:#e65100;}
  .fitness-icon.oyin{background:#fff4e0;color:#b8720a;}
  #draw-canvas{width:100%;height:280px;border-radius:16px;border:1.5px solid var(--teal-200);background:#fff;touch-action:none;display:block;}
  .color-swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:inline-block;margin:6px;transition:.15s;}
  .color-swatch.selected{border-color:var(--teal-700);transform:scale(1.15);}
  .canvas-toolbar{display:flex;gap:10px;margin:10px 0;}
  .canvas-toolbar button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--teal-200);background:#fff;font-size:13px;cursor:pointer;}
  .game-option{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--teal-200);border-radius:14px;background:#fff;font-size:14.5px;cursor:pointer;transition:.15s;}
  .game-option:hover{border-color:var(--teal-400);}
  .game-option.correct{border-color:#2f8577;background:var(--teal-100);}
  .game-option.wrong{border-color:var(--rose);background:#fdeceb;}
  .streak-badge{display:inline-flex;align-items:center;gap:4px;background:var(--coral);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;}

  .video-wrap{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;
    background:#000;
  }
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  .video-open-card{
    display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--teal-700),var(--teal-500));
    color:#fff;border-radius:var(--radius-sm);padding:16px;margin-bottom:14px;text-decoration:none;
  }
  .video-open-icon{
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .video-open-title{font-size:14px;font-weight:700;}
  .video-open-sub{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:1px;}

  .breath-card{text-align:center;}
  .breath-stage{display:flex;align-items:center;justify-content:center;padding:20px 0;}
  .breath-circle{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--teal-200), var(--teal-500));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:12.5px;text-align:center;padding:10px;
    box-shadow:0 8px 24px -8px rgba(47,133,119,0.5);
  }
  .breath-stage.walk-mode{flex-direction:column;gap:14px;}
  .walk-icon{font-size:44px;height:70px;display:flex;align-items:center;justify-content:center;}
  .walk-icon #walk-emoji{display:inline-block;}
  .walk-icon #walk-emoji.bounce{animation:walkBounce 0.55s ease-in-out infinite;}
  @keyframes walkBounce{
    0%,100%{transform:translateX(-14px) rotate(-10deg);}
    50%{transform:translateX(14px) rotate(10deg);}
  }
  .walk-label{font-size:13.5px;font-weight:700;color:var(--teal-700);}

  .case-tag{
    display:inline-block;font-size:10.5px;font-weight:700;
    background:var(--teal-100);color:var(--teal-700);
    padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:0.02em;
  }

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .e-icon{font-size:36px;margin-bottom:10px;}

  .profile-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
  }
  .profile-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;position:relative;
  }
  .profile-hero{
    background:linear-gradient(160deg,var(--teal-100),#fff);
    border-radius:var(--radius);padding:18px;margin-bottom:8px;border:1px solid var(--line);
  }
  .edit-fab{
    margin-left:auto;background:#fff;border:1px solid var(--line);width:36px;height:36px;
    border-radius:10px;font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .reward-strip{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;
    border:1px solid var(--line);
  }
  .reward-emoji{font-size:30px;flex-shrink:0;}
  .reward-badge-img{width:52px;height:52px;flex-shrink:0;}
  .reward-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .reward-note{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .today-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;
  }
  .today-stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;
  }
  .today-num{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-700);font-weight:600;}
  .today-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .today-num{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-700);font-weight:600;}
  .today-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .routine-card{padding-bottom:10px;}
  .routine-summary{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--teal-100);border-radius:12px;padding:10px 12px;margin-bottom:12px;
    font-size:12.5px;color:var(--teal-900);line-height:1.4;
  }
  .routine-close{background:none;border:none;color:var(--teal-700);font-size:14px;cursor:pointer;flex-shrink:0;}
  .routine-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  }
  .routine-row:last-child{border-bottom:none;}
  .routine-icon{font-size:20px;flex-shrink:0;width:30px;text-align:center;}
  .routine-mid{flex:1;min-width:0;}
  .routine-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .routine-time{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .routine-desc{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .routine-status{font-size:11px;font-weight:700;flex-shrink:0;color:var(--ink-soft);}
  .routine-row.r-active .routine-title{color:var(--teal-700);}
  .routine-row.r-done .routine-status{color:var(--green-ok);}
  .routine-row.r-missed .routine-status{color:var(--red-ok);}
  .routine-row.r-pending{opacity:0.55;}
  .routine-btn{
    background:var(--coral);color:#fff;border:none;border-radius:10px;
    padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;
    font-family:'Manrope',sans-serif;
  }
  .routine-edit-link{background:none;border:none;color:var(--teal-500);font-size:12px;font-weight:700;cursor:pointer;}
  .routine-del-btn{background:none;border:none;font-size:16px;cursor:pointer;flex-shrink:0;}

  .avatar{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(145deg,var(--teal-400),var(--teal-700));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;flex-shrink:0;
  }
  .profile-name{font-size:17px;margin-bottom:2px;}
  .profile-sub{font-size:12.5px;color:var(--ink-soft);}

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  }
  .pill.green{background:var(--green-ok-bg);color:var(--green-ok);}
  .pill.amber{background:var(--amber-ok-bg);color:var(--amber-ok);}
  .pill.red{background:var(--red-ok-bg);color:var(--red-ok);}

  .divider-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);font-weight:700;margin:22px 0 10px 2px;
  }

  .field-input{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Manrope',sans-serif;font-size:14.5px;color:var(--ink);
    background:var(--cream);outline:none;
  }
  .field-input:focus{border-color:var(--teal-400);}

  .reaction-card{
    background:linear-gradient(160deg,var(--teal-100),#fff);
    border-radius:var(--radius);padding:22px 18px;text-align:center;
    margin-top:14px;border:1px solid var(--line);
  }
  .reaction-emoji{font-size:42px;display:inline-block;margin-bottom:8px;}
  .reaction-line{margin:0;font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5;}
  @keyframes reactLaugh{
    0%,100%{transform:rotate(0deg) scale(1);}
    20%{transform:rotate(-12deg) scale(1.15);}
    40%{transform:rotate(10deg) scale(1.1);}
    60%{transform:rotate(-8deg) scale(1.15);}
    80%{transform:rotate(6deg) scale(1.05);}
  }
  @keyframes reactWarm{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  .react-laugh{animation:reactLaugh 0.9s ease-in-out 2;}
  .react-warm{animation:reactWarm 1.4s ease-in-out 2;}

  .badge-svg{width:96px;height:96px;margin:0 auto 10px auto;display:block;}

  ::-webkit-scrollbar{width:0;}

  /* ---------------- TABIAT RELAKSATSIYA MODULI (nat-*) ---------------- */
  @keyframes natFloat{0%,100%{transform:translateY(0px) rotate(0deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  @keyframes natBreathe{0%,100%{transform:scale(1);opacity:.8;box-shadow:0 0 30px rgba(74,222,128,.4);}50%{transform:scale(1.18);opacity:1;box-shadow:0 0 70px rgba(74,222,128,.8);}}
  @keyframes natCharacter{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.03);}}
  @keyframes natSway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(3deg);}}
  @keyframes natCloud{0%{transform:translateX(-20px);opacity:.3;}50%{transform:translateX(20px);opacity:.7;}100%{transform:translateX(-20px);opacity:.3;}}
  @keyframes natSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes natBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

  .nat-card{background:#fff;border:1.5px solid var(--teal-200);border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;}
  .nat-card-tag{position:absolute;top:0;right:0;font-size:10px;font-weight:700;padding:4px 12px;border-radius:0 0 0 16px;}
  .nat-card-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .nat-btn{width:100%;border:none;color:#fff;font-weight:700;padding:14px;border-radius:16px;font-size:13px;cursor:pointer;margin-top:10px;}

  .nat-overlay{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;backdrop-filter:blur(20px);transition:.4s;}
  .nat-overlay.show{display:flex;}
  .nat-bg-1{background:linear-gradient(135deg,#064e3b 0%,#022c22 50%,#0f172a 100%);}
  .nat-bg-2{background:linear-gradient(135deg,#0369a1 0%,#0c4a6e 50%,#0f172a 100%);}
  .nat-bg-3{background:linear-gradient(135deg,#312e81 0%,#1e1b4b 50%,#0f172a 100%);}
  .nat-topbar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;}
  .nat-step-badge{font-size:11px;color:#6ee7b7;font-weight:700;background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);padding:6px 12px;border-radius:20px;}
  .nat-close{width:40px;height:40px;border-radius:50%;background:rgba(15,23,42,.8);border:1px solid #334155;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}

/* Video havolasini o'rnatilgan (embed) player kodiga aylantiradi.
   YouTube (watch?v=, youtu.be/) va Google Drive (file/d/ID/view) havolalarini qo'llab-quvvatlaydi. */
function videoEmbedHtml(url){
  if(!url) return '';
  const yt1 = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{6,})/);
  const yt2 = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
  const drive = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);

  if(yt1 || yt2){
    const vid = (yt1||yt2)[1];
    const embedSrc = `https://www.youtube.com/embed/${vid}`;
    const watchUrl = `https://www.youtube.com/watch?v=${vid}`;
    return `<div class="video-wrap"><iframe src="${embedSrc}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>
      <a href="${watchUrl}" target="_blank" rel="noopener" class="video-open-card" style="margin-top:8px;">
        <div class="video-open-icon">▶</div>
        <div><div class="video-open-title">Video ochilmasa, shu yerga bosing</div><div class="video-open-sub">YouTube'da yangi oynada ochiladi</div></div>
      </a>`;
  }
  if(drive){
    // Google Drive iframe ko'plab muhitlarda (jumladan Telegram ichida) ishlamaydi,
    // shuning uchun ishonchli "yangi oynada ochish" kartochkasi ko'rsatamiz.
    const openUrl = `https://drive.google.com/file/d/${drive[1]}/view`;
    return `<a href="${openUrl}" target="_blank" rel="noopener" class="video-open-card">
      <div class="video-open-icon">▶</div>
      <div><div class="video-open-title">Video ko'rsatmani ko'rish</div><div class="video-open-sub">Yangi oynada ochiladi</div></div>
    </a>`;
  }
  return `<div class="video-wrap"><iframe src="${url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
}

  variants:{A:"Hech narsa bo'lmagandek davom etasiz",B:"O'quvchidan xususiy uzr so'raysiz",C:"Boshqalar oldida yana bir bor tanbeh berasiz"},
  togri:"B",izoh:"Xato qilganda uzr so'rash — pedagog uchun kuchsizlik emas, aksincha hurmatni mustahkamlaydi."},
 {id:"c20",sarlavha:"Guruh ishida beadolat taqsimot",vaziyat:"Guruh loyihasida bir o'quvchi butun ishni o'zi qilib, boshqalari hech narsa qilmadi. Baholashda nima qilasiz?",
  variants:{A:"Hammaga bir xil baho qo'yasiz",B:"Har birining shaxsiy hissasini alohida baholaysiz",C:"Faqat guruh rahbariga baho qo'yasiz"},
  togri:"B",izoh:"Individual hissa asosida baholash — adolat va mas'uliyatni ta'minlaydi."},
 {id:"c21",sarlavha:"Sinfda telefon muammosi",vaziyat:"Dars vaqtida o'quvchi yashirincha telefonda o'ynayapti. Nima qilasiz?",
  variants:{A:"Sinf oldida telefonni tortib olasiz",B:"Yaqinlashib, xotirjam eslatasiz, keyin qoidani qayta tushuntirasiz",C:"Ko'rmaganga olasiz"},
  togri:"B",izoh:"Nozik, hurmatli eslatma — sharmandalikka olib kelmasdan qoidaga rioya qilishni ta'minlaydi."},
 {id:"c22",sarlavha:"Kasbiy shubha lahzasi",vaziyat:"Bir necha kundan buyon o'z kasbiy mahoratingizga shubha qilyapsiz. Nima qilasiz?",
  variants:{A:"Bu his-tuyg'ularni bostirasiz, ishni davom ettirasiz",B:"Ishonchli hamkasb yoki mentor bilan bo'lishasiz",C:"Kasbni tashlab ketish haqida qaror qabul qilasiz"},
  togri:"B",izoh:"Kasbiy shubha — normal jarayon. Qo'llab-quvvatlash tarmog'i bilan bo'lishish yengillik beradi."},
 {id:"c23",sarlavha:"Ota-onaning haddan tashqari himoyasi",vaziyat:"Ota-ona farzandining har bir kichik xatosini sizning aybingiz deb hisoblaydi. Nima qilasiz?",
  variants:{A:"Bahslashib, o'zingizni oqlaysiz",B:"Xotirjam, faktlarga asoslangan holda, farzandning rivojlanishiga qanday hamkorlik qilish mumkinligini taklif qilasiz",C:"Ota-ona bilan muloqotni to'xtatasiz"},
  togri:"B",izoh:"Hamkorlik taklifi — ziddiyatni hamkorlikka aylantiradi, bola manfaatiga xizmat qiladi."},
 {id:"c24",sarlavha:"Sinfda diniy yoki madaniy farq",vaziyat:"Sinfda turli e'tiqod/madaniyatdagi o'quvchilar orasida kichik tushunmovchilik yuz berdi. Nima qilasiz?",
  variants:{A:"Mavzuni umuman ko'tarmaysiz",B:"Hurmat va xilma-xillik haqida ochiq, hurmatli suhbat tashkil qilasiz",C:"Bir tomonni qo'llab-quvvatlaysiz"},
  togri:"B",izoh:"Ochiq va hurmatli muloqot — xilma-xillikni tushunish va qabul qilishga yordam beradi."},
 {id:"c25",sarlavha:"O'z vaqtingizni boshqarish",vaziyat:"Ish, uy vazifalarini tekshirish va shaxsiy hayot orasida vaqt yetishmayapti. Nima qilasiz?",
  variants:{A:"Kechalari uxlamay ishlaysiz",B:"Ustuvorliklarni belgilab, ba'zi vazifalarni soddalashtirasiz yoki delegatsiya qilasiz",C:"Barcha narsani to'liq bajarishga urinib, doim charchagan yurasiz"},
  togri:"B",izoh:"Vaqtni boshqarish va ustuvorlik belgilash — kasbiy charchashning oldini oladi."},
 {id:"c26",sarlavha:"Salbiy fikr-mulohaza",vaziyat:"Ota-onalar yig'ilishida bir ota-ona sizning metodikangizni ochiq tanqid qildi. Nima qilasiz?",
  variants:{A:"Himoyaga o'tib, bahslashasiz",B:"Fikrini tinglab, keyin professional tarzda o'z yondashuvingizni tushuntirasiz",C:"Yig'ilishni tark etasiz"},
  togri:"B",izoh:"Tinglash va professional javob — hurmatni saqlab, ishonchni mustahkamlaydi."},
 {id:"c27",sarlavha:"O'quvchi confidentiality (sirni saqlash)",vaziyat:"O'quvchi sizga shaxsiy, og'ir muammosini \"hech kimga aytmang\" deb ishonib gapirdi. Bu jiddiy xavf tug'dirishi mumkin. Nima qilasiz?",
  variants:{A:"Va'dangizga qat'iy amal qilib, hech kimga aytmaysiz",B:"O'quvchiga tushuntirib, uning xavfsizligi uchun mutaxassis/rahbariyatga murojaat qilasiz",C:"Darhol butun sinfga aytib yuborasiz"},
  togri:"B",izoh:"Xavfsizlik masalasida maxfiylikdan ustun narsa yo'q — mutaxassisga yo'naltirish to'g'ri va mas'uliyatli yo'l."},
 {id:"c28",sarlavha:"Yangi metodika qarshiligi",vaziyat:"Yangi ta'lim metodikasini joriy qilmoqchisiz, lekin hamkasblar qarshilik ko'rsatmoqda. Nima qilasiz?",
  variants:{A:"Yolg'iz, ularsiz davom ettirasiz",B:"Kichik natijalarni ko'rsatib, bosqichma-bosqich ishontirasiz",C:"G'oyadan butunlay voz kechasiz"},
  togri:"B",izoh:"Kichik, ko'rinadigan natijalar orqali ishontirish — o'zgarishlarni qabul qildirishning samarali yo'li."},
 {id:"c29",sarlavha:"Sinfdagi jim norozilik",vaziyat:"Butun sinf darsdan norozi, lekin hech kim ochiq aytmayapti, faqat sovuq muносabat bildirishmoqda. Nima qilasiz?",
  variants:{A:"E'tibor bermay davom etasiz",B:"Ochiq, xavfsiz muhitda fikrlarini bilishga harakat qilasiz",C:"Sinfni jazolaysiz"},
  togri:"B",izoh:"Ochiq muloqot uchun xavfsiz makon yaratish — yashirin noroziliкni konstruktiv fikr-mulohazaga aylantiradi."},
 {id:"c30",sarlavha:"O'zingizga g'amxo'rlik qilish qiyinligi",vaziyat:"Boshqalarga yordam berishga o'rganib qolgansiz, lekin o'zingizga vaqt ajratish sizga \"xudbinlik\" kabi tuyuladi. Nima qilasiz?",
  variants:{A:"O'zingizni doim orqa planga qo'yaverasiz",B:"O'zingizga g'amxo'rlik qilish — uzoq muddatda boshqalarga ham foydali ekanini tan olasiz",C:"Charchoqni tan olmay, ishni davom ettiraverasiz"},
  togri:"B",izoh:"O'z-o'ziga g'amxo'rlik — xudbinlik emas, balki barqaror va samarali pedagog bo'lishning zarur sharti."},
 {id:"c31",sarlavha:"O'quvchi ko'chirma ishlatgan",vaziyat:"O'quvchi topshirgan insho internetdan ko'chirilgani aniq bo'lib qoldi. Qanday yo'l tutasiz?",
  variants:{A:"Darhol nol baho qo'yib, jazolaysiz",B:"O'quvchi bilan xususiy suhbatlashib, sababini bilasiz va qayta yozish imkonini berasiz",C:"E'tibor bermay o'tkazib yuborasiz"},
  togri:"B",izoh:"Tarbiyaviy yondashuv jazolashdan ko'ra samaraliroq — sabab aniqlansa, kelajakda takrorlanmaydi."},
 {id:"c32",sarlavha:"Sinfda uyat holat",vaziyat:"Dars vaqtida o'zingiz kichik xatoga yo'l qo'ydingiz va o'quvchilar buni payqab qolishdi. Nima qilasiz?",
  variants:{A:"Xatoni tan olib, ochiqchasiga tuzatasiz",B:"Xatoni yashirishga harakat qilasiz",C:"Mavzuni butunlay o'zgartirib yuborasiz"},
  togri:"A",izoh:"Xatoni tan olish — o'qituvchining ham inson ekanini ko'rsatadi va o'quvchilarga halollik namunasi bo'ladi."},
 {id:"c33",sarlavha:"Ota-onaning haddan tashqari aralashuvi",vaziyat:"Bir ota-ona har kuni farzandining bahosi haqida sizga qo'ng'iroq qilib, bezovta qilmoqda. Qanday chegara qo'yasiz?",
  variants:{A:"Qo'ng'iroqlarga umuman javob bermay qo'yasiz",B:"Muloyimlik bilan aloqa vaqtini va usulini (masalan haftalik hisobot) taklif qilasiz",C:"Har safar uzoq va batafsil javob berib, vaqtingizni sarflayverasiz"},
  togri:"B",izoh:"Aniq va hurmatli chegara qo'yish — ham ota-ona bilan aloqani saqlaydi, ham sizning vaqtingizni himoya qiladi."},
 {id:"c34",sarlavha:"Kam ta'minlangan sinf",vaziyat:"Sinfingizda zarur o'quv materiallari (kitob, doska belgisi) yetishmaydi. Nima qilasiz?",
  variants:{A:"Materiallar kelguncha kutib, dars sifatini pasaytirasiz",B:"O'zingiz mavjud resurslardan ijodiy foydalanib, muqobil yechim topasiz",C:"O'quvchilardan pul yig'ib, o'zingiz sotib olasiz"},
  togri:"B",izoh:"Ijodiy yondashuv — cheklangan resurslar sharoitida ham sifatli ta'lim berish imkonini beradi."},
 {id:"c35",sarlavha:"Guruh ishida nizо",vaziyat:"Guruh loyihasida bir o'quvchi hech narsa qilmay, boshqalarning mehnatidan foydalanmoqchi. Guruh a'zolari shikoyat qilishmoqda. Nima qilasiz?",
  variants:{A:"Hamma a'zoga bir xil baho qo'yaverasiz",B:"Har bir a'zoning individual hissasini alohida baholaysiz",C:"Butun guruhni jazolaysiz"},
  togri:"B",izoh:"Individual baholash — adolatni ta'minlaydi va mas'uliyatsizlikni rag'batlantirmaydi."},
 {id:"c36",sarlavha:"Sinfdagi kamsitish holati",vaziyat:"Bir o'quvchi millati yoki tashqi ko'rinishi tufayli boshqalar tomonidan masxara qilinmoqda. Nima qilasiz?",
  variants:{A:"Darhol aralashib, bunday xulq-atvor mutlaqo qabul qilinmasligini tushuntirasiz",B:"O'quvchilar o'zlari hal qilishini kutasiz",C:"Faqat jabrlanuvchini chetga chaqirib, \"e'tibor berma\" deysiz"},
  togri:"A",izoh:"Kamsitishga nisbatan o'qituvchining darhol va aniq pozitsiyasi — sinfda xavfsiz muhitni shakllantiradi."},
 {id:"c37",sarlavha:"Sovg'a taklif qilingan holat",vaziyat:"Ota-ona farzandiga \"yaxshiroq munosabatda bo'lishingiz\" evaziga qimmat sovg'a taklif qilmoqda. Nima qilasiz?",
  variants:{A:"Sovg'ani xushmuomalalik bilan, lekin qat'iy rad etasiz",B:"Sovg'ani qabul qilib, hech narsa o'zgartirmaysiz",C:"Sovg'ani qabul qilib, chindan ham alohida munosabatda bo'lasiz"},
  togri:"A",izoh:"Kasbiy odob va barcha o'quvchilarga adolatli munosabat — pedagogning eng muhim tamoyillaridan biri."},
 {id:"c38",sarlavha:"O'quvchining shaxsiy muammosi",vaziyat:"O'quvchi sizga uyda oilaviy muammolar borligini maxfiy tarzda aytib qoldi. Qanday harakat qilasiz?",
  variants:{A:"Buni darhol butun sinfga aytib yuborasiz",B:"Maxfiylikni saqlab, kerak bo'lsa maktab psixologiga yo'naltirasiz",C:"E'tiborsiz qoldirasiz, bu sizning ishingiz emas deb o'ylaysiz"},
  togri:"B",izoh:"Maxfiylikni hurmat qilish va mutaxassisga yo'naltirish — o'quvchining ishonchini saqlaydi va unga haqiqiy yordam beradi."},
 {id:"c39",sarlavha:"Hamkasblar orasidagi g'iybat",vaziyat:"O'qituvchilar xonasida hamkasblaringiz boshqa bir hamkasb haqida g'iybat qilishmoqda. Qanday munosabatda bo'lasiz?",
  variants:{A:"Suhbatga qo'shilib, siz ham fikr bildirasiz",B:"Muloyimlik bilan suhbat mavzusini o'zgartirasiz yoki chetga chiqasiz",C:"Hamma narsani eshitib, keyin boshqalarga aytib yurasiz"},
  togri:"B",izoh:"G'iybatdan uzoq turish — kasbiy muhitni sog'lom saqlaydi va o'z obro'yingizni himoya qiladi."},
 {id:"c40",sarlavha:"Onlayn darsda diqqat tarqoqligi",vaziyat:"Masofaviy dars vaqtida o'quvchilarning aksariyati kamerani o'chirib, darsga e'tibor bermayapti. Nima qilasiz?",
  variants:{A:"Darsni shunchaki davom ettiraverasiz",B:"Interaktiv, qatnashuvni talab qiluvchi topshiriqlar kiritib, jalb qilishga harakat qilasiz",C:"Barcha o'quvchilarni jazolashga urinasiz"},
  togri:"B",izoh:"Interaktivlik — masofaviy ta'limda diqqatni jalb qilishning eng samarali usuli."},
 {id:"c41",sarlavha:"Xato baho qo'yilgani",vaziyat:"Nazorat ishlarini tekshirayotganda, bir hafta oldin bir o'quvchiga noto'g'ri (past) baho qo'yganingizni payqadingiz. Nima qilasiz?",
  variants:{A:"Xatoni tan olmay, shunday qoldirasiz",B:"Xatoni tan olib, bahoni to'g'irlaysiz va o'quvchidan uzr so'raysiz",C:"O'quvchiga aytmasdan, jurnalda yashirincha o'zgartirasiz"},
  togri:"B",izoh:"Xatoni ochiq tan olish va tuzatish — adolat va halollik tamoyillariga mos, ishonchni mustahkamlaydi."},
 {id:"c42",sarlavha:"Iqtidorli, lekin intizomsiz o'quvchi",vaziyat:"Juda iqtidorli, lekin doimo intizomni buzadigan o'quvchi bilan qanday ishlaysiz?",
  variants:{A:"Uni doimo jazolab, boshqalar bilan bir xil talab qo'yaverasiz",B:"Uning kuchli tomonlarini topib, energiyasini ijobiy yo'nalishga yo'naltirasiz",C:"Uni e'tiborsiz qoldirib, faqat itoatkor o'quvchilarga vaqt sarflaysiz"},
  togri:"B",izoh:"Iqtidorni to'g'ri yo'naltirish — intizom muammosini ko'pincha o'zi hal qiladi."},
 {id:"c43",sarlavha:"Imtihon oldidan xavotir",vaziyat:"Muhim imtihon oldidan sinfingizda umumiy xavotir va stress kuchaygan. Nima qilasiz?",
  variants:{A:"Qo'shimcha bosim o'tkazib, \"jiddiy tayyorlaning\" deysiz",B:"Qisqa relaksatsiya mashqi o'tkazib, ularni xotirjamlashtirasiz",C:"Mavzuni umuman ko'tarmaysiz"},
  togri:"B",izoh:"Imtihon oldidan xotirjamlik — natijaga sifat bilan tayyorgarlikdan ko'ra ko'proq ta'sir qilishi mumkin."},
 {id:"c44",sarlavha:"Davomat past bo'lgan o'quvchi",vaziyat:"Bir o'quvchi darslarga tez-tez kelmay qo'ydi, sababi noma'lum. Qanday harakat qilasiz?",
  variants:{A:"Faqat davomat jurnaliga \"kelmadi\" deb qayd qilaverasiz",B:"Ota-ona bilan bog'lanib, sababini bilishga harakat qilasiz",C:"O'quvchini sinfdan chetlatish haqida o'ylaysiz"},
  togri:"B",izoh:"Sabab bilmasdan xulosa chiqarish xato — ko'pincha ortida jiddiy oilaviy yoki sog'liq muammosi yotishi mumkin."},
 {id:"c45",sarlavha:"Zamonaviy texnologiyaga qarshilik",vaziyat:"Maktab yangi raqamli platformaga o'tmoqda, lekin siz bunga unchalik moslasha olmayapsiz. Nima qilasiz?",
  variants:{A:"O'zgarishni butunlay rad etasiz",B:"Vaqt ajratib, bosqichma-bosqich o'rganishga harakat qilasiz",C:"Boshqalardan yordam so'rashni o'zingizga ep ko'rmaysiz"},
  togri:"B",izoh:"Doimiy o'rganishga ochiqlik — zamonaviy pedagogning muhim kasbiy sifati hisoblanadi."},
 {id:"c46",sarlavha:"Kasbiy tanqidga munosabat",vaziyat:"Rahbaringiz dars metodikangizni hamma hamkasblar oldida tanqid qildi. Qanday munosabatda bo'lasiz?",
  variants:{A:"Darhol himoyalanib, janjal chiqarasiz",B:"Xotirjam qabul qilib, keyinroq alohida suhbatda fikr almashasiz",C:"Ichingizga yutib, uzoq vaqt xafa yurasiz"},
  togri:"B",izoh:"Konstruktiv fikr-mulohazani xotirjam qabul qilish va keyin muzokara qilish — professional yetuklik belgisi."},
 {id:"c47",sarlavha:"Ish-hayot muvozanati",vaziyat:"Ish paytida ham, uyda ham doimo maktab ishlari haqida o'ylayotganingizni payqadingiz. Nima qilasiz?",
  variants:{A:"Bu normal deb, davom ettiraverasiz",B:"Ish va shaxsiy hayot orasida aniq chegara belgilashga harakat qilasiz",C:"Uydagi vaqtni ham to'liq ish uchun ajratasiz"},
  togri:"B",izoh:"Sog'lom chegaralar — uzoq muddatli kasbiy barqarorlik va charchashning oldini olish uchun zarur."},
 {id:"c48",sarlavha:"Yangi o'qituvchiga yordam",vaziyat:"Maktabingizga yangi kelgan tajribasiz hamkasb yordam so'ramoqda, lekin sizning ham vaqtingiz tanqis. Nima qilasiz?",
  variants:{A:"Vaqtingiz yo'qligini aytib, butunlay rad etasiz",B:"Qisqa, aniq maslahatlar berib, imkon qadar qo'llab-quvvatlaysiz",C:"Uning ishini o'zingiz bajarib berasiz"},
  togri:"B",izoh:"Kollegial qo'llab-quvvatlash — jamoaviy muhitni mustahkamlaydi, hatto band vaqtda ham kichik yordam qadrlanadi."},
 {id:"c49",sarlavha:"O'z his-tuyg'ularini boshqarish",vaziyat:"Uyda shaxsiy muammolaringiz bor va bu kayfiyatingizga ta'sir qilyapti, lekin darsga kirishingiz kerak. Nima qilasiz?",
  variants:{A:"Kayfiyatingizni o'quvchilarga sezdirib, jahldor bo'lib qolasiz",B:"Darsdan oldin bir necha daqiqa nafas mashqi qilib, o'zingizni jamlaysiz",C:"Darsni butunlay bekor qilasiz"},
  togri:"B",izoh:"Qisqa o'zini jamlash amaliyoti — professional holatni saqlab, o'quvchilarga sifatli dars berish imkonini beradi."},
 {id:"c50",sarlavha:"Uzoq muddatli motivatsiya",vaziyat:"Bir necha yildan beri bir xil dasturda ishlayotganingiz uchun ishga bo'lgan qiziqishingiz so'nib borayotganini sezyapsiz. Nima qilasiz?",
  variants:{A:"Bu holatni e'tiborsiz qoldirib, avtomatik tarzda ishlayverasiz",B:"Yangi metodika yoki yondashuvlarni o'rganib, ishingizga yangilik kiritasiz",C:"Kasbni butunlay tashlab ketish haqida qat'iy qaror qabul qilasiz"},
  togri:"B",izoh:"O'z kasbiy rivojlanishiga doimiy investitsiya — motivatsiyani tiklashning eng samarali yo'li."},
 {id:"c51",sarlavha:"Doimiy gaplashuvchi o'quvchi",vaziyat:"Bitta o'quvchi har darsda qo'shnisi bilan gaplashib, sizni va sinfni chalg'itadi. Bir necha marta ogohlantirgansiz, natija yo'q. Endi qanday yo'l tutasiz?",
  variants:{A:"Uni butun sinf oldida qattiq tanbeh berib uyaltirasiz",B:"O'tirish joyini almashtirib, dars tugagach xususiy suhbat qurasiz",C:"E'tibor bermay, ovozingizni balandroq qilib davom etaverasiz"},
  togri:"B",izoh:"Ommaviy tanqid ko'pincha qarshilikni kuchaytiradi; joy almashtirish va xususiy muloqot sabab bilan ishlashga imkon beradi."},
 {id:"c52",sarlavha:"Telefon muammosi",vaziyat:"Dars vaqtida bir o'quvchi partaning tagida yashirincha telefonda o'ynayotganini payqadingiz. Qanday harakat qilasiz?",
  variants:{A:"Telefonni tortib olib, darsdan keyin ota-onasiga faqat shaxsan qaytarasiz",B:"Sinf oldida telefonni ko'rsatib, hammani kuldirib xijolat qilasiz",C:"Sekin yoniga borib, past ovozda telefonni yig'ishtirishni so'raysiz"},
  togri:"C",izoh:"Vaziyatni kattalashtirmasdan, xotirjam va shaxsiy murojaat — darsni to'xtatmasdan muammoni hal qiladi."},
 {id:"c53",sarlavha:"Internetdagi nizo sinfga ko'chdi",vaziyat:"Ikki o'quvchi ijtimoiy tarmoqda til topisha olmay, bu nizo darsda ham davom etyapti. Ular bir-biriga gap qaytarib, sinf diqqatini buzmoqda. Birinchi qadamingiz nima bo'ladi?",
  variants:{A:"Ikkalasini alohida-alohida tinglab, vaziyatni tushunishga harakat qilasiz",B:"Ikkalasiga baravar jazo beraverasiz",C:"Muammoni ular o'zlari hal qilishini kutib, aralashmaysiz"},
  togri:"A",izoh:"Har ikki tomonni alohida tinglash — adolatli qaror qabul qilish va nizoning ildizini topish imkonini beradi."},
 {id:"c54",sarlavha:"O'qish qiyinchiligi bo'lgan o'quvchi",vaziyat:"Bir o'quvchi matnni o'qishda sinfdoshlaridan sezilarli orqada qolmoqda, lekin bu haqda hech kim gapirmagan. Sizga nima ma'qul?",
  variants:{A:"Uni boshqalar bilan bir xil talab ostida qoldirib, o'zi \"tortishib olishi\"ni kutasiz",B:"Ota-ona va maktab mutaxassisi (logoped/psixolog) bilan bog'lanib, individual yondashuv rejalashtirasiz",C:"Uni sinfda ovoz chiqarib o'qishga majburlab, \"mashq qilsin\" deysiz"},
  togri:"B",izoh:"O'qish qiyinchiligi ko'pincha maxsus diagnostika talab qiladi; erta murojaat qilish uzoq muddatli natijani yaxshilaydi."},
 {id:"c55",sarlavha:"Iqtidorli, lekin zerikkan o'quvchi",vaziyat:"Bir o'quvchi mavzuni hammadan tez o'zlashtirib, qolgan vaqtda zerikib, sinfni chalg'ita boshlaydi. Qanday yechim topasiz?",
  variants:{A:"Uni jim o'tirishga majburlaysiz",B:"Unga qo'shimcha, chuqurlashtirilgan topshiriqlar berib, boshqalarga yordamchi rolini taklif qilasiz",C:"Uni doim tanbeh berib turasiz"},
  togri:"B",izoh:"Iqtidorli o'quvchini qo'shimcha vazifa bilan band qilish — zerikishning oldini oladi va uning salohiyatidan foydalanadi."},
 {id:"c56",sarlavha:"Yangi ko'chib kelgan o'quvchi",vaziyat:"Boshqa hududdan ko'chib kelgan o'quvchi tilni yaxshi bilmagani uchun sinfga qo'shila olmay, yolg'iz o'tiribdi. Nima qilishingiz kerak?",

/* ---------------- STATE ---------------- */
const LS_KEY = "pedagog_wellness_v1";
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if(TG){ TG.ready(); TG.expand(); }

function defaultState(){ return {results:{}, fitnesDone:[], casesDone:{}, profile:{name:"", age:"", staj:"", email:""}, routine:{}}; }
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(!s) return defaultState();
    if(!s.profile) s.profile = {name:"", age:"", staj:"", email:""};
    if(!s.routine) s.routine = {};
    return s;
  }
  catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
  if(TG && TG.CloudStorage){ TG.CloudStorage.setItem(LS_KEY, JSON.stringify(STATE), function(){}); }
}
let STATE = loadState();
let VIEW = {name: STATE.profile.name ? "home" : "onboarding"};
let ANSWERS = {};

/* Telegram CloudStorage'dan holatni tekshirib, agar u yerda mavjud bo'lsa (localStorage tozalangan bo'lsa ham) tiklaydi. */
function bootFromCloud(){
  if(!(TG && TG.CloudStorage)) { render(); return; }
  TG.CloudStorage.getItem(LS_KEY, function(err, value){
    if(!err && value){
      try{
        const cloud = JSON.parse(value);
        if(cloud && cloud.profile && cloud.profile.name){
          STATE = cloud;
          if(!STATE.routine) STATE.routine = {};
          VIEW = {name:"home"};
        }
      }catch(e){}
    }
    render();
  });
}

/* ---------------- RESULT BADGES (illustrated, not plain emoji) ---------------- */
function badgeSvg(level){
  const palettes = {
    green:{a:'#7fc79a', b:'#3f8f66'},
    amber:{a:'#f3c26a', b:'#d99a2e'},
    red:{a:'#f0a08e', b:'#d8674f'}
  };
  const c = palettes[level] || palettes.green;
  const icons = {
    green: `<path d="M32 47l9 9 17-19" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
    amber: `<path d="M28 50c4-14 12-20 24-22" stroke="#fff" stroke-width="4.2" stroke-linecap="round" fill="none"/>
            <path d="M46 26l6 2-2 6" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
    red: `<path d="M48 48c-9 6-9 6-16 0-5-4-5-11 0-14 3-2 7-1 8 2 1-3 5-4 8-2 5 3 5 10 0 14z" fill="#fff"/>`
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" class="badge-svg" viewBox="0 0 96 96" fill="none">
    <circle cx="48" cy="48" r="46" fill="url(#g-${level})"/>
    <defs><radialGradient id="g-${level}" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="${c.a}"/><stop offset="100%" stop-color="${c.b}"/>
    </radialGradient></defs>
    ${icons[level] || icons.green}
  </svg>`;
}

/* ---------------- HELPERS ---------------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function go(view){ if(BREATH_TIMER){clearTimeout(BREATH_TIMER); BREATH_TIMER=null;} VIEW = view; ANSWERS = {}; render(); window.scrollTo(0,0); }
function fmtDate(){ const d=new Date(); return d.toLocaleDateString('uz-UZ'); }

function scaleLevel(val, low, high){
  if(val <= low) return 'green';
  if(val <= high) return 'amber';
  return 'red';
}

function topbar(title, sub, showBack){
  return `<header class="topbar">
    ${showBack ? `<button class="back-btn" onclick="go({name:'home'})">←</button>` : `<div class="logo-mark">${LOGO_SVG}</div>`}
    <div class="titles">
      <h1>${title}</h1>
      <p>${sub}</p>
    </div>
  </header>`;
}

function bottomNav(active){
  const items = [
    {key:'home', label:'Bosh sahifa', icon:ICONS.home},
    {key:'fitnes', label:'Fitnes', icon:ICONS.fitnes},
    {key:'cases', label:'Cases', icon:ICONS.cases},
    {key:'profil', label:'Profil', icon:ICONS.profil}
  ];
  return `<nav class="bottom-nav">
    ${items.map(it => `<button class="nav-btn ${active===it.key?'active':''}" onclick="go({name:'${it.key}'})">${it.icon}<span>${it.label}</span></button>`).join('')}
  </nav>`;
}

/* Apps Script Web App URL shu yerga qo'yiladi (deploy qilingandan keyin). Bo'sh bo'lsa, ilova faqat mahalliy (localStorage) rejimda ishlaydi. */
const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbwjnxZLaMq3ZxmDvTPh_KJUrKv2JdUlIuWE_uCXEreYBM9HQ1STSjT8jKfhdYH_X4L53w/exec" };

async function syncSave(){
  if(!CONFIG.API_URL || !STATE.profile.email) return;
  const chatId = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) ? TG.initDataUnsafe.user.id : '';
  try{
    await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'sync', email: STATE.profile.email, profile: STATE.profile, state: STATE, telegram_chat_id: chatId})
    });
  }catch(e){ console.warn('Sync xato:', e); }
}

async function logResult(testName, level, label, details){
  if(!CONFIG.API_URL || !STATE.profile.email) return;
  try{
    await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'log', email: STATE.profile.email, profile: STATE.profile, testName, level, label, details})
    });
  }catch(e){ console.warn('Log xato:', e); }
}

async function syncLoad(email){
  if(!CONFIG.API_URL || !email) return null;
  try{
    const res = await fetch(`${CONFIG.API_URL}?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    if(data.status === 'ok') return data.state;
    return null;
  }catch(e){ console.warn('Yuklash xato:', e); return null; }
}

/* ---------------- KUN TARTIBI (foydalanuvchi o'zi tuzadi, Toshkent vaqti UTC+5) ---------------- */
function tashkentNowStr(){
  const d = new Date(Date.now() + 5*3600*1000);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}
function tashkentDateKey(offsetDays){
  offsetDays = offsetDays || 0;
  const d = new Date(Date.now() + 5*3600*1000 + offsetDays*86400000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function getRoutineSchedule(){
  return (STATE.customRoutine || []).slice().sort((a,b)=> a.time.localeCompare(b.time));
}
function routineStatus(schedule, idx, todayKey){
  const nowStr = tashkentNowStr();
  const item = schedule[idx];
  const done = STATE.routine[todayKey] && STATE.routine[todayKey][item.id];
  if(done) return 'done';
  const nextTime = schedule[idx+1] ? schedule[idx+1].time : '23:59';
  if(nowStr < item.time) return 'pending';
  if(nowStr < nextTime) return 'active';
  return 'missed';
}
function markRoutineDone(id){
  const key = tashkentDateKey(0);
  if(!STATE.routine[key]) STATE.routine[key] = {};
  STATE.routine[key][id] = true;
  saveState(); syncSave();
  render();
}
function dismissRoutineSummary(dateKey){
  if(!STATE.routineSummarySeen) STATE.routineSummarySeen = {};
  STATE.routineSummarySeen[dateKey] = true;
  saveState();
  render();
}
function routineWidgetHtml(){
  const schedule = getRoutineSchedule();
  if(schedule.length === 0){
    return `<div class="card routine-card" style="text-align:center;">
      <div style="font-size:28px;margin-bottom:6px;">🗓️</div>
      <p style="margin:0 0 12px 0;font-size:13.5px;color:var(--ink-soft)">Kun tartibingiz hali bo'sh. O'z rejalaringizni kiriting — ilova ularni vaqti-vaqtida eslatib turadi.</p>
      <button class="btn secondary" onclick="go({name:'routine_edit'})">+ Reja qo'shish</button>
    </div>`;
  }
  const todayKey = tashkentDateKey(0);
  const statusMeta = {
    pending:{label:'Kutilmoqda', cls:'r-pending'},
    active:{label:'Hozir', cls:'r-active'},
    done:{label:'Bajarildi ✅', cls:'r-done'},
    missed:{label:'Bajarilmadi', cls:'r-missed'}
  };
  const items = schedule.map((item, idx)=>{
    const st = routineStatus(schedule, idx, todayKey);
    const meta = statusMeta[st];
    return `<div class="routine-row ${meta.cls}">
      <div class="routine-icon">${item.icon||'⏰'}</div>
      <div class="routine-mid">
        <div class="routine-title">${item.title} <span class="routine-time">${item.time}</span></div>
        ${item.desc ? `<div class="routine-desc">${item.desc}</div>` : ''}
      </div>
      ${st==='active' ? `<button class="routine-btn" onclick="markRoutineDone('${item.id}')">Bajardim</button>` : `<span class="routine-status">${meta.label}</span>`}
    </div>`;
  }).join('');

  const yKey = tashkentDateKey(-1);
  let summaryHtml = '';
  if(STATE.routine[yKey] && (!STATE.routineSummarySeen || !STATE.routineSummarySeen[yKey])){
    const doneCount = schedule.filter(it=>STATE.routine[yKey][it.id]).length;
    const total = schedule.length;
    let msg;
    if(doneCount===total) msg = "Kecha barcha rejalarni bajardingiz! Ajoyib intizom 🌟";
    else if(doneCount===0) msg = "Kecha birorta rejani bajarolmadingiz — bugun qaytadan boshlaymiz, hammasi joyida 🤍";
    else msg = `Kecha ${doneCount}/${total} rejani bajardingiz — yaxshi natija, davom eting 💪`;
    summaryHtml = `<div class="routine-summary">
      <span>${msg}</span>
      <button class="routine-close" onclick="dismissRoutineSummary('${yKey}')">✕</button>
    </div>`;
  }

  return `<div class="card routine-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="eyebrow" style="margin-bottom:0;">Kun tartibi</div>
      <button class="routine-edit-link" onclick="go({name:'routine_edit'})">Sozlash</button>
    </div>
    ${summaryHtml}
    ${items}
  </div>`;
}

/* ---------------- TAVSIYA TIZIMI: Xoll+MBI+Xeym natijalariga asoslangan ---------------- */
const XOLL_SCALE_TO_COMPONENT = {
  "Emotsional xabardorlik": "anglash",
  "O'z emotsiyalarini boshqarish": "ozini_boshqarish",
  "O'z-o'zini motivatsiya qilish": "motivatsiya",
  "Empatiya": "empatiya",
  "Boshqalar emotsiyasini boshqarish": "boshqalarni_boshqarish"
};

function getWeakComponents(){
  const xoll = STATE.results && STATE.results.xoll;
  const mbi = STATE.results && STATE.results.mbi;
  const xeym = STATE.results && STATE.results.xeym;
  let weak = [];
  if(xoll && xoll.scales && xoll.scales.length){
    const sorted = xoll.scales.slice().sort((a,b)=> a.val - b.val);
    weak = sorted.slice(0,2).map(s => XOLL_SCALE_TO_COMPONENT[s.name]).filter(Boolean);
  } else {
    weak = ["ozini_boshqarish", "boshqalarni_boshqarish"];
  }
  if(mbi){
    if(mbi.EE >= 27 && !weak.includes("ozini_boshqarish")) weak.unshift("ozini_boshqarish");
    if(mbi.DP >= 13 && !weak.includes("boshqalarni_boshqarish")) weak.unshift("boshqalarni_boshqarish");
    if(mbi.PA <= 31 && !weak.includes("motivatsiya")) weak.unshift("motivatsiya");
  }
  if(xeym && xeym.level === 'red' && !weak.includes("ozini_boshqarish")) weak.unshift("ozini_boshqarish");
  return [...new Set(weak)].slice(0,2);
}

function getRecommendedFitnes(count){
  count = count || 3;
  const weak = getWeakComponents();
  const pool = FITNES.filter(f => weak.includes(f.eiKomponent));
  const notDone = pool.filter(f => !STATE.fitnesDone.includes(f.id));
  const finalPool = notDone.length >= count ? notDone : pool;
  const dayIdx = Math.floor(Date.now()/86400000);
  const rotN = Math.max(finalPool.length,1);
  const rotated = finalPool.slice(dayIdx % rotN).concat(finalPool.slice(0, dayIdx % rotN));
  return rotated.slice(0, count);
}

function renderRecommendationCard(){
  const hasAnyResult = STATE.results && (STATE.results.xoll || STATE.results.mbi || STATE.results.xeym);
  const recs = getRecommendedFitnes(3);
  if(!recs.length) return '';
  const weak = getWeakComponents();
  const componentLabels = {
    anglash:"Emotsional xabardorlik", ozini_boshqarish:"O'z emotsiyalarini boshqarish",
    motivatsiya:"O'z-o'zini motivatsiyalash", empatiya:"Empatiya", boshqalarni_boshqarish:"Boshqalar emotsiyasini boshqarish"
  };
  const weakLabel = weak.map(w=>componentLabels[w]).join(", ");
  return `
    <div class="section-title" style="margin-top:22px;">Sizga tavsiya etiladi</div>
    <p class="section-sub" style="margin-bottom:10px;">${hasAnyResult ? `Natijalaringizga ko'ra: <b>${weakLabel}</b>` : "Testdan o'tsangiz, aynan sizga mos tavsiyalar chiqadi"}</p>
    ${recs.map(f=>`
      <div class="card test-card" onclick="go({name:'fitnes_detail', id:'${f.id}'})">
        <div class="test-icon fitness-icon ${f.turi==='jismoniy'?'jismoniy':f.turi==='relaks'?'relaks':f.turi==='muloqot'?'muloqot':f.turi==='refleksiya'?'refleksiya':''}">${f.icon}</div>
        <div><h3>${f.nomi}</h3><p>${f.maqsad}</p></div>
        <div class="chev">${ICONS.chev}</div>
      </div>
    `).join('')}
  `;
}

function autoScheduleRecommendations(){
  if(!STATE.customRoutine) STATE.customRoutine = [];
  STATE.customRoutine = STATE.customRoutine.filter(it => !it.auto);
  const recs = getRecommendedFitnes(3);
  if(!recs.length) return;
  const slots = [{time:"10:00", idx:0},{time:"14:00", idx:1},{time:"18:00", idx:2}];
  slots.forEach(slot=>{
    const f = recs[slot.idx % recs.length];
    if(!f) return;
    STATE.customRoutine.push({
      id: 'auto'+slot.time.replace(':','')+'_'+f.id,
      time: slot.time,
      title: `${f.icon} ${f.nomi} (${f.daq} daq)`,
      icon: f.icon,
      desc: "Sizga moslashtirilgan tiklanish mashqi",
      auto: true,
      fitnesId: f.id
    });
  });
  saveState();
  syncSave();
}

function finishXoll(){
  const scaleResults = XOLL_SCALES.map(s=>{

  else if(total>=40){level='amber';label="O'rta darajadagi Emotsional Intellekt";}

    green:"Ajoyib natija! Emotsional zukkoligingiz yuqori darajada — bu kasbiy va shaxsiy hayotingizda katta kuch. 🌟",

  };
  const result = {date:fmtDate(), total, level, label, msg:messages[level], scales:scaleResults};
  STATE.results.xoll = result; saveState();

  logResult('Xoll (EQ)', level, label, {total, scales:scaleResults});

function breathWidgetHtml(pattern, visualType){

function toggleBreathAnim(mode){
  const btn = document.getElementById('breath-toggle-btn');
  if(BREATH_TIMER){
    clearTimeout(BREATH_TIMER); BREATH_TIMER = null;
    document.getElementById('breath-label').textContent = "To'xtatildi";
    if(mode==='walk'){ const e=document.getElementById('walk-emoji'); if(e) e.classList.remove('bounce'); }
    else { const c=document.getElementById('breath-circle'); if(c) c.style.transform='scale(1)'; }
    btn.textContent = "Qayta boshlash";
    return;
  }
  const pattern = VIEW.breathPattern;
  btn.textContent = "To'xtatish";
  runBreathCycle(pattern, 0, mode);
}
function runBreathCycle(pattern, idx, mode){
  const label = document.getElementById('breath-label');
  if(!label) { BREATH_TIMER=null; return; }
  const phase = pattern[idx % pattern.length];
  label.textContent = phase.label;
  if(mode==='walk'){
    const emoji = document.getElementById('walk-emoji');
    if(emoji){ if(phase.walking) emoji.classList.add('bounce'); else emoji.classList.remove('bounce'); }
  } else {
    const circle = document.getElementById('breath-circle');
    if(circle){
      circle.style.transform = `scale(${phase.scale||1})`;
      circle.style.transition = `transform ${phase.sec}s ease-in-out`;
    }
  }
  BREATH_TIMER = setTimeout(()=> runBreathCycle(pattern, idx+1, mode), phase.sec*1000);
}

let DRAW_CTX = null, DRAW_COLOR = '#1f5c52', DRAWING = false;

function initDrawCanvas(){
  const canvas = document.getElementById('draw-canvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio||1);
  canvas.height = rect.height * (window.devicePixelRatio||1);
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 4;
  DRAW_CTX = ctx;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx, y:cy};
  }
  function start(e){ DRAWING = true; const p = pos(e); ctx.strokeStyle = DRAW_COLOR; ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!DRAWING) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ DRAWING = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function setDrawColor(c){ DRAW_COLOR = c; }
function clearDrawCanvas(){
  const canvas = document.getElementById('draw-canvas');
  if(!canvas || !DRAW_CTX) return;
  DRAW_CTX.clearRect(0,0,canvas.width,canvas.height);
}

  const el = document.getElementById('swatch-'+hex.replace('#',''));
  if(el) el.classList.add('selected');
  SELECTED_MOOD_COLOR = {hex, nomi};
}
function finishMoodColor(id){
  if(!SELECTED_MOOD_COLOR){ alert("Iltimos, avval rangni tanlang"); return; }
  const note = document.getElementById('mood-color-note').value.trim();
  STATE.moodColors = STATE.moodColors || [];
  STATE.moodColors.push({date:fmtDate(), color:SELECTED_MOOD_COLOR, note});
  if(!STATE.fitnesDone.includes(id)) STATE.fitnesDone.push(id);
  saveState();
  syncSave();
  alert(`Rahmat! "${SELECTED_MOOD_COLOR.nomi}" — bugungi kayfiyatingiz sifatida saqlandi. 🎨`);
  go({name:'fitnes'});
}

    startFn:'startGame'
  });

let GAME_STATE = { idx:0, score:0, streak:0, maxStreak:0, answered:false, picked:null };
function startGame(){
  GAME_STATE = { idx:0, score:0, streak:0, maxStreak:0, answered:false, picked:null };
  VIEW = {name:'game_q', idx:0};
  render();
}
function renderGameQuestion(idx){
  const total = GAME_QUESTIONS.length;
  const q = GAME_QUESTIONS[idx];
  const answered = GAME_STATE.answered;
  const picked = GAME_STATE.picked;
  const body = `
    ${topbar('Hissiyotlar lug\'ati', `Vaziyat ${idx+1} / ${total}`, true)}
    <main>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span style="font-size:13px;color:var(--ink-soft)">Ball: ${GAME_STATE.score}</span>
        ${GAME_STATE.streak>=2 ? `<span class="streak-badge">🔥 ${GAME_STATE.streak} ketma-ket</span>` : ''}
      </div>
      <div class="card" style="margin-bottom:16px;"><p style="margin:0;font-size:15px;line-height:1.6;">${q.vaziyat}</p></div>
      <p class="section-sub" style="margin-bottom:10px;">Bu holatda qanday hissiyot eng aniq mos keladi?</p>
      ${q.options.map((opt,i)=>{
        let cls = 'game-option';
        if(answered){ if(i===q.togri) cls += ' correct'; else if(i===picked) cls += ' wrong'; }
        return `<button class="${cls}" ${answered?'disabled':''} onclick="answerGame(${idx},${i})">${opt}</button>`;
      }).join('')}
      ${answered ? `
        <div class="card" style="background:${picked===q.togri?'var(--teal-100)':'#fdeceb'};margin-top:12px;">
          <p style="margin:0;font-size:13.5px;line-height:1.5;"><b>${picked===q.togri?'✅ To\'g\'ri!':'💡 Deyarli!'}</b><br>${q.izoh}</p>
        </div>
        <button class="btn" style="margin-top:14px" onclick="nextGame(${idx})">${idx===total-1?'Natijani ko\'rish':'Keyingi vaziyat'}</button>
      ` : ''}
    </main>
  `;
  document.getElementById('app').innerHTML = body;
}
function answerGame(idx, i){
  if(GAME_STATE.answered) return;
  const q = GAME_QUESTIONS[idx];
  GAME_STATE.answered = true; GAME_STATE.picked = i;
  if(i === q.togri){ GAME_STATE.score += 10; GAME_STATE.streak += 1; GAME_STATE.maxStreak = Math.max(GAME_STATE.maxStreak, GAME_STATE.streak); }
  else { GAME_STATE.streak = 0; }
  renderGameQuestion(idx);
}
function nextGame(idx){
  if(idx < GAME_QUESTIONS.length-1){ GAME_STATE.answered = false; GAME_STATE.picked = null; VIEW = {name:'game_q', idx:idx+1}; render(); }
  else { finishGame(); }
}
function finishGame(){
  const total = GAME_QUESTIONS.length;
  const pct = Math.round(GAME_STATE.score / (total*10) * 100);
  let level, label, msg;
  if(pct>=80){ level='green'; label='Ajoyib emotsional lug\'at!'; msg='Siz hissiyotlarni juda aniq farqlaysiz — bu kasbiy muloqotda katta afzallik. 🌟'; }
  else if(pct>=50){ level='amber'; label='Yaxshi asos bor'; msg='Ko\'p vaziyatlarni to\'g\'ri angladingiz. Amaliyot davom etsa, yanada aniqlashadi. 🌱'; }
  else { level='red'; label='Rivojlanish uchun ajoyib boshlanish'; msg='Hissiyotlarni aniq nomlash — mashq talab qiladigan ko\'nikma. Har bir o\'yin sizni bir qadam oldinga olib boradi. 🤍'; }
  const result = {date:fmtDate(), score:GAME_STATE.score, pct, maxStreak:GAME_STATE.maxStreak, level, label, msg};
  STATE.gameResults = STATE.gameResults || [];
  STATE.gameResults.push(result);
  saveState(); syncSave();
  VIEW = {name:'game_result'}; render();
}
function renderGameResult(){
  const results = STATE.gameResults || [];
  const r = results[results.length-1];
  if(!r){ go({name:'game_intro'}); return; }
  const body = `
    ${topbar('Natija', 'Hissiyotlar lug\'ati', true)}
    <main>
      <div class="result-hero" style="background:linear-gradient(160deg,#fff4e0,#fff)">
        <div class="result-emoji">${r.level==='green'?'🌟':r.level==='amber'?'🌱':'🤍'}</div>
        <div class="result-title">${r.label}</div>
        <p class="result-score">${r.score} ball · ${r.pct}% to'g'ri · Eng uzun seriya: ${r.maxStreak}</p>
      </div>
      <div class="card"><p style="margin:0;font-size:14px;line-height:1.6;">${r.msg}</p></div>
      <button class="btn" onclick="startGame()">Qayta o'ynash</button>
      <button class="btn secondary" style="margin-top:10px" onclick="go({name:'home'})">Bosh sahifaga qaytish</button>
    </main>
  `;
  document.getElementById('app').innerHTML = body;
}

function openNaturePlayer(progId){
  ensureNatureOverlay();
  NAT_STATE.progId = progId;
  NAT_STATE.stepIdx = 0;
  const data = NATURE_PROGRAMS[progId];
  const overlay = document.getElementById('natOverlay');
  overlay.className = 'nat-overlay show ' + data.themeClass;
  document.getElementById('natAura').style.background = data.auraColor;
  if(!NAT_MUSIC_ON) startNatureMusic();
  loadNatureStep();
}

function loadNatureStep(){
  const data = NATURE_PROGRAMS[NAT_STATE.progId];
  const steps = data.steps;
  if(NAT_STATE.stepIdx >= steps.length){
    closeNaturePlayer();
    const succ = document.getElementById('natSuccess');
    if(succ) succ.classList.add('show');
    if(!STATE.fitnesDone.includes('nature'+NAT_STATE.progId)){
      STATE.fitnesDone.push('nature'+NAT_STATE.progId);
      saveState(); syncSave();
    }
    return;
  }
  const cur = steps[NAT_STATE.stepIdx];
  document.getElementById('natStepBadge').innerHTML = `🍃 Qadam ${NAT_STATE.stepIdx+1}/${steps.length}`;
  document.getElementById('natCharEmoji').innerText = cur.emoji;
  document.getElementById('natCharLabel').innerText = cur.action;
  document.getElementById('natTitle').innerText = cur.title;
  document.getElementById('natInstruction').innerText = cur.instruction;
  NAT_STATE.timeLeft = cur.duration;
  document.getElementById('natTimer').innerText = String(NAT_STATE.timeLeft).padStart(2,'0');
  if(NAT_STATE.timerInterval) clearInterval(NAT_STATE.timerInterval);
  NAT_STATE.timerInterval = setInterval(()=>{
    NAT_STATE.timeLeft--;
    const timerEl = document.getElementById('natTimer');
    if(timerEl) timerEl.innerText = String(NAT_STATE.timeLeft).padStart(2,'0');
    if(NAT_STATE.timeLeft <= 0){
      clearInterval(NAT_STATE.timerInterval);
      NAT_STATE.stepIdx++;
      loadNatureStep();
    }
  }, 1000);
}

function nextNatureStep(){
  if(NAT_STATE.timerInterval) clearInterval(NAT_STATE.timerInterval);
  NAT_STATE.stepIdx++;
  loadNatureStep();
}

function closeNaturePlayer(){
  if(NAT_STATE.timerInterval) clearInterval(NAT_STATE.timerInterval);
  const overlay = document.getElementById('natOverlay');
  if(overlay){ overlay.classList.remove('show'); }
}

function closeNatureSuccess(){
  const succ = document.getElementById('natSuccess');
  if(succ) succ.classList.remove('show');
  go({name:'fitnes'});
}

function toggleNatureMusic(){
  if(!NAT_MUSIC_ON) startNatureMusic(); else stopNatureMusic();
}
function startNatureMusic(){
  try{
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    NAT_AUDIO_CTX = new AudioContext();
    NAT_MUSIC_ON = true;
    const btn = document.getElementById('natAudioBtn');
    if(btn) btn.innerText = '🔊';
    playNatureChord();
    NAT_SYNTH_INTERVAL = setInterval(playNatureChord, 6000);
  }catch(e){ console.log('Audio not supported'); }
}
function stopNatureMusic(){
  if(NAT_SYNTH_INTERVAL) clearInterval(NAT_SYNTH_INTERVAL);
  if(NAT_AUDIO_CTX){ NAT_AUDIO_CTX.close(); NAT_AUDIO_CTX = null; }
  NAT_MUSIC_ON = false;
  const btn = document.getElementById('natAudioBtn');
  if(btn) btn.innerText = '🔇';
}
function playNatureChord(){
  if(!NAT_AUDIO_CTX || !NAT_MUSIC_ON) return;
  const freqs = [261.63, 329.63, 392.00, 523.25, 659.25];
  freqs.forEach((freq, i)=>{
    setTimeout(()=>{
      if(!NAT_AUDIO_CTX || !NAT_MUSIC_ON) return;
      const osc = NAT_AUDIO_CTX.createOscillator();
      const gain = NAT_AUDIO_CTX.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, NAT_AUDIO_CTX.currentTime);
      gain.gain.setValueAtTime(0, NAT_AUDIO_CTX.currentTime);
      gain.gain.linearRampToValueAtTime(0.03, NAT_AUDIO_CTX.currentTime + 1.5);
      gain.gain.exponentialRampToValueAtTime(0.0001, NAT_AUDIO_CTX.currentTime + 5.0);
      osc.connect(gain); gain.connect(NAT_AUDIO_CTX.destination);
      osc.start(); osc.stop(NAT_AUDIO_CTX.currentTime + 5.5);
    }, i * 800);
  });
}

function renderReactionCard(reaction){
  return `<div class="reaction-card">
    <div class="reaction-emoji ${reaction.anim}">${reaction.emoji}</div>
    <p class="reaction-line">${reaction.line}</p>
  </div>`;
}

function submitJournal(id){
  const text = document.getElementById('journal-text').value.trim();
  if(!text){ alert("Iltimos, voqeangizni yozing"); return; }
  const reaction = analyzeJournal(text);
  STATE.journalLast = {date:fmtDate(), text, reaction};
  if(!STATE.fitnesDone.includes(id)) STATE.fitnesDone.push(id);
  saveState();
  syncSave();
  renderFitnesDetail(id);
}
function toggleFitnesDone(id){
  const i = STATE.fitnesDone.indexOf(id);
  if(i>-1) STATE.fitnesDone.splice(i,1); else STATE.fitnesDone.push(id);
  saveState();
  syncSave();
  renderFitnesDetail(id);
}

/* ---------------- CASES ---------------- */
/* Kuniga 3 ta case tanlash: sana asosida, hamma foydalanuvchiga bir xil kun uchun bir xil 3 ta chiqadi,
   pool tugagach yana boshidan aylanadi (rotatsiya). */
function todaysCases(){
  const daysSinceEpoch = Math.floor((Date.now() + 5*3600*1000) / 86400000);
  const n = CASES.length;
  const start = (daysSinceEpoch * 3) % n;
  const picked = [];
  for(let i=0;i<3;i++) picked.push(CASES[(start+i) % n]);
  return picked;
}

function renderCases(){
  const today = todaysCases();
  const allDone = today.every(c => STATE.casesDone[c.id]);
  function caseCard(c){
    const done = STATE.casesDone[c.id];
    return `<div class="card test-card" onclick="go({name:'case_detail', id:'${c.id}'})">
      <div class="test-icon" style="background:${done?'var(--green-ok-bg)':'var(--teal-100)'};color:${done?'var(--green-ok)':'var(--teal-700)'}">${done?'✅':'🎯'}</div>
      <div>
        <h3>${c.sarlavha} ${done?(done.correct?'· To\'g\'ri javob':'· Bajarildi'):''}</h3>
        <p>${done ? "Siz bu vaziyatni yechdingiz" : c.vaziyat.slice(0,50)+'...'}</p>
      </div>
      <div class="chev">${ICONS.chev}</div>
    </div>`;
  }
  const body = `
    ${topbar('Cases','Amaliy pedagogik vaziyatlar')}
    <main>
      <p class="section-sub">Real vaziyatlarni o'qing va eng maqbul yechimni tanlang. Har kuni 3 ta yangi vaziyat taqdim etiladi.</p>
      <div class="divider-label">✨ Bugungi 3 ta vaziyat</div>
      ${today.map(c=>caseCard(c)).join('')}
      ${allDone ? `<div class="card" style="text-align:center;padding:22px;">
        <div style="font-size:30px;margin-bottom:8px;">🌙</div>
        <p style="margin:0;font-size:14px;font-weight:700;color:var(--teal-700)">Barcha bugungi vaziyatlarni yechdingiz!</p>
        <p style="margin:6px 0 0 0;font-size:12.5px;color:var(--ink-soft)">Ertangi yangi 3 ta vaziyatni kuting 🌸</p>
      </div>` : ''}
    </main>
    ${bottomNav('cases')}
  `;
  document.getElementById('app').innerHTML = body;
}
function renderCaseDetail(id){
  const c = CASES.find(x=>x.id===id);
  const done = STATE.casesDone[id];
  const body = `
    ${topbar(c.sarlavha,'Vaziyatni o\'qib, javob tanlang', true)}
    <main>
      <div class="card">
        <div class="case-tag">Vaziyat</div>
        <p style="margin:0;font-size:14.5px;line-height:1.6">${c.vaziyat}</p>
      </div>
      ${Object.keys(c.variants).map(k=>{
        let cls='';
        if(done){
          if(k===c.togri) cls='correct';
          else if(k===done.choice) cls='incorrect';
        } else if(done===undefined && ANSWERS.pick===k) cls='selected';
        return `<button class="option-btn ${cls}" ${done?'disabled':''} onclick="pickCase('${id}','${k}')"><b>${k})</b> ${c.variants[k]}</button>`;
      }).join('')}
      ${done ? `<div class="result-msg" style="margin-top:6px;"><b>${done.correct?"To'g'ri javob! ✅":"Boshqa fikr, lekin bu ham o'rganish imkoniyati ⚠️"}</b><br><br>${c.izoh}</div>
        <button class="btn secondary" onclick="go({name:'cases'})">Cases ro'yxatiga qaytish</button>` : ''}
    </main>
    ${bottomNav('cases')}
  `;
  document.getElementById('app').innerHTML = body;
}
function pickCase(id, choice){
  const c = CASES.find(x=>x.id===id);
  STATE.casesDone[id] = {choice, correct: choice===c.togri, date:fmtDate()};
  saveState();
  syncSave();
  renderCaseDetail(id);
}

/* ---------------- PROFIL ---------------- */
function todaysFitnesDoneCount(){
  // fitnesDone massivida sana yozilmagani uchun, hozircha umumiy sonni ko'rsatamiz;
  // journal (Minnatdorchilik) uchun sana bor, shundan bugungini aniqlaymiz.
  let count = 0;
  if(STATE.journalLast && STATE.journalLast.date === fmtDate()) count++;
  return count;
}
function rewardBadge(){
  const r = STATE.results;
  const levels = [r.xoll, r.mbi, r.xeym].filter(Boolean).map(x=>x.level);
  if(levels.length===0) return null;
  if(levels.includes('green')) return {level:'green', title:'Barqarorlik medali', note:"Natijalaringizdan biri yuqori darajada — ajoyib natija!"};
  if(levels.includes('red')) return {level:'red', title:"O'zingizga g'amxo'rlik vaqti", note:"Bugun kichik bir mashqni bajarib ko'ring — bu katta farq qiladi."};
  return {level:'amber', title:"Rivojlanish yo'lida", note:"Har kuni kichik qadam — katta natijaga olib boradi."};
}

/* ---------------- FAOLLIK DARAJASI (gamifikatsiya) ----------------
   Umumiy faollik ballini fitnes/mashq, keys va oyin natijalaridan hisoblab,
   unga mos unvon (badge) qaytaradi. */
function getActivityScore(){
  const fitnesScore = (STATE.fitnesDone || []).length * 5;
  const casesScore = Object.keys(STATE.casesDone || {}).length * 3;
  const gameScore = (STATE.gameResults || []).reduce((sum, r) => sum + (r.score || 0), 0);
  const moodScore = (STATE.moodColors || []).length * 2;
  return fitnesScore + casesScore + gameScore + moodScore;
}
function getActivityBadge(){
  const score = getActivityScore();
  let title, icon, next;
  if(score >= 200){ title = "Hissiy Intellekt Ustasi"; icon = "🏆"; next = null; }
  else if(score >= 100){ title = "Faol Ustoz"; icon = "⭐"; next = 200; }
  else if(score >= 40){ title = "Rivojlanayotgan Pedagog"; icon = "🌱"; next = 100; }
  else { title = "Yangi boshlovchi"; icon = "🌿"; next = 40; }
  return { score, title, icon, next };
}
function renderActivityBadgeCard(){
  const b = getActivityBadge();
  const progressPct = b.next ? Math.min(100, Math.round(b.score / b.next * 100)) : 100;
  return `
    <div class="card" style="text-align:center;background:linear-gradient(160deg,#fff9ec,#fff);">
      <div style="font-size:40px;margin-bottom:6px;">${b.icon}</div>
      <div style="font-weight:700;font-size:16px;color:var(--teal-700);">${b.title}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin:4px 0 10px 0;">${b.score} ball</div>
      ${b.next ? `
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div></div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Keyingi darajagacha: ${b.next - b.score} ball</div>
      ` : `<div style="font-size:12px;color:var(--ink-soft);">Eng yuqori daraja qo'lga kiritildi! 🎉</div>`}
    </div>
  `;
}

function renderProfil(){
  const r = STATE.results;
  const doneCount = STATE.fitnesDone.length;
  const casesCount = Object.keys(STATE.casesDone).length;
  const todayFitnes = todaysFitnesDoneCount();
  const todayCases = Object.values(STATE.casesDone).filter(c=>c.date===fmtDate()).length;
  const reward = rewardBadge();

  function miniCard(title, data, goName){
    if(!data){
      return `<div class="card">
        <h3 style="font-size:14.5px;margin-bottom:4px;">${title}</h3>
        <p style="margin:0;font-size:13px;color:var(--ink-soft)">Hali test ishlanmagan</p>
        <button class="btn secondary" style="margin-top:12px" onclick="go({name:'${goName}'})">Testni boshlash</button>
      </div>`;
    }
    const label = data.label || data.profil;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <h3 style="font-size:14.5px;margin-bottom:6px;">${title}</h3>
        <span class="pill ${data.level}">${label}</span>
      </div>
      <p style="margin:0;font-size:12.5px;color:var(--ink-soft)">${data.date}</p>
    </div>`;
  }
  const recentCases = Object.entries(STATE.casesDone).slice(-5).reverse();
  const p = STATE.profile;
  const initial = (p.name||'P').trim().charAt(0).toUpperCase();
  const metaBits = [];
  if(p.age) metaBits.push(p.age + ' yosh');
  if(p.staj) metaBits.push(p.staj + ' yillik staj');
  const body = `
    ${topbar('Profil','Sizning yo\'lingiz')}
    <main>
      <div class="profile-hero">
        <div class="profile-header" style="margin-bottom:14px;">
          <div class="avatar">${initial}</div>
          <div>
            <div class="profile-name">${p.name || 'Pedagog'}</div>
            <div class="profile-sub">${metaBits.join(' · ') || 'Ma\'lumot kiritilmagan'}</div>
          </div>
          <button class="edit-fab" onclick="go({name:'edit_profile'})">✏️</button>
        </div>
        ${reward ? `<div class="reward-strip">
          <img class="reward-badge-img" src="data:image/svg+xml;utf8,${encodeURIComponent(badgeSvg(reward.level))}" />
          <div><div class="reward-title">${reward.title}</div><div class="reward-note">${reward.note}</div></div>
        </div>` : ''}
      </div>
      ${renderActivityBadgeCard()}

      <div class="divider-label">Bugungi kun (${fmtDate()})</div>
      <div class="today-grid">
        <div class="today-stat"><div class="today-num">${todayFitnes}</div><div class="today-label">Fitnes / refleksiya</div></div>
        <div class="today-stat"><div class="today-num">${todayCases}</div><div class="today-label">Yechilgan keys</div></div>
        <div class="today-stat"><div class="today-num">${doneCount}</div><div class="today-label">Jami mashqlar</div></div>
        <div class="today-stat"><div class="today-num">${casesCount}</div><div class="today-label">Jami keyslar</div></div>
      </div>

      <div class="divider-label">Diagnostika natijalari</div>
      ${miniCard('Emotsional Intellekt', r.xoll, 'xoll_intro')}
      ${miniCard('Kasbiy charchash', r.mbi, 'mbi_intro')}
      ${miniCard('Stressga bardosh', r.xeym, 'xeym_intro')}

      ${recentCases.length ? `
      <div class="divider-label">Oxirgi yechilgan keyslar</div>
      <div class="card">
        ${recentCases.map(([cid, d])=>{
          const c = CASES.find(x=>x.id===cid);
          if(!c) return '';
          return `<div class="routine-row" style="border-bottom:1px solid var(--line);">
            <div class="routine-icon">${d.correct?'✅':'🔁'}</div>
            <div class="routine-mid"><div class="routine-title" style="font-size:13px;">${c.sarlavha}</div></div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}

function renderEditProfile(){
  const p = STATE.profile;
  const body = `
    ${topbar('Ma\'lumotlarni tahrirlash','', true)}
    <main>
      <div class="card">
        <div class="eyebrow">Ism</div>
        <input id="ep-name" class="field-input" type="text" value="${p.name||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Yosh</div>
        <input id="ep-age" class="field-input" type="number" value="${p.age||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Pedagogik staj (yil)</div>
        <input id="ep-staj" class="field-input" type="number" value="${p.staj||''}"/>
      </div>
      <button class="btn" onclick="saveEditProfile()">Saqlash</button>
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}
function saveEditProfile(){
  const name = document.getElementById('ep-name').value.trim();
  const age = document.getElementById('ep-age').value.trim();
  const staj = document.getElementById('ep-staj').value.trim();
  if(!name){ alert("Iltimos, ismingizni kiriting"); return; }
  STATE.profile = {name, email: STATE.profile.email, age, staj};
  saveState();
  syncSave();
  go({name:'profil'});
}

/* ---------------- ROUTER ---------------- */
function render(){
  switch(VIEW.name){
    case 'onboarding': return renderOnboarding();
    case 'home': return renderHome();
    case 'xoll_intro': return renderXollIntro();
    case 'xoll_q': return renderXollQuestion(VIEW.idx);
    case 'xoll_result': return renderXollResult();
    case 'mbi_intro': return renderMbiIntro();
    case 'mbi_q': return renderMbiQuestion(VIEW.idx);
    case 'mbi_result': return renderMbiResult();
    case 'xeym_intro': return renderXeymIntro();
    case 'xeym_q': return renderXeymQuestion(VIEW.idx);
    case 'xeym_result': return renderXeymResult();
    case 'fitnes': return renderFitnes();
    case 'fitnes_detail': return renderFitnesDetail(VIEW.id);
    case 'cases': return renderCases();
    case 'case_detail': return renderCaseDetail(VIEW.id);
    case 'profil': return renderProfil();
    case 'routine_edit': return renderRoutineEdit();
    case 'edit_profile': return renderEditProfile();
    case 'game_intro': return renderGameIntro();
    case 'game_q': return renderGameQuestion(VIEW.idx);
    case 'game_result': return renderGameResult();
    case 'nature_intro': return renderNatureIntro();
    default: return renderHome();
  }
}
