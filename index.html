<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedagog Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832;
    --teal-700:#1f5c52;
    --teal-500:#2f8577;
    --teal-400:#4a9b8e;
    --teal-200:#a9d4c9;
    --teal-100:#e2f2ee;
    --cream:#faf8f4;
    --cream-2:#f2efe7;
    --coral:#f2a15a;
    --coral-dark:#e0813a;
    --rose:#e88a7d;
    --ink:#1c2b28;
    --ink-soft:#4c5c58;
    --line: #e4ded2;
    --green-ok:#5c9a72;
    --green-ok-bg:#e9f4ec;
    --amber-ok:#c98a2e;
    --amber-ok-bg:#faf1de;
    --red-ok:#c0654f;
    --red-ok-bg:#fbeae5;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px -12px rgba(18,56,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: var(--shadow);
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 14px 20px;
    background: linear-gradient(180deg, var(--teal-900) 0%, var(--teal-700) 100%);
    color:#fff;
    border-radius: 0 0 26px 26px;
    position:relative;
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:180px;height:180px;
    background: radial-gradient(circle, rgba(242,161,90,0.35), transparent 70%);
  }
  .logo-mark{
    width:44px;height:44px;border-radius:14px;
    background: rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo-mark svg{width:26px;height:26px;}
  header.topbar .titles{position:relative;z-index:1;}
  header.topbar h1{font-size:19px;color:#fff;}
  header.topbar p{margin:2px 0 0 0;font-size:12.5px;color:var(--teal-200);}
  .back-btn{
    background:rgba(255,255,255,0.16);
    border:none;color:#fff;width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:18px;flex-shrink:0;
  }
  main{
    flex:1;
    padding: 18px 18px 100px 18px;
    overflow-y:auto;
  }
  .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.09em;
    color:var(--teal-500);
    font-weight:700;
    margin-bottom:6px;
  }
  .section-title{font-size:22px;margin-bottom:4px;}
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px 0;line-height:1.5;}

  .card{
    background:#fff;
    border-radius: var(--radius);
    padding:18px;
    box-shadow: 0 6px 18px -10px rgba(18,56,50,0.14);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .test-card{
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .test-card:active{transform:scale(0.98);}
  .test-icon{
    width:52px;height:52px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  .test-card h3{font-size:16px;margin-bottom:2px;}
  .test-card p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .chev{margin-left:auto;color:var(--teal-400);font-size:20px;flex-shrink:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background: var(--teal-500);
    color:#fff;border:none;border-radius:14px;
    padding:14px 20px;font-size:15px;font-weight:700;
    cursor:pointer;width:100%;
    font-family:'Manrope',sans-serif;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:hover{background:var(--teal-700);}
  .btn.secondary{
    background:transparent;color:var(--teal-700);border:1.5px solid var(--teal-400);
  }
  .btn.coral{background:var(--coral);}
  .btn.coral:hover{background:var(--coral-dark);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .progress-wrap{margin-bottom:18px;}
  .progress-bar{height:6px;background:var(--cream-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--teal-400),var(--coral));border-radius:6px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-align:right;}

  .question-card{
    background:#fff;border-radius:var(--radius);padding:22px 20px;
    border:1px solid var(--line);margin-bottom:20px;
  }
  .question-text{font-size:16.5px;line-height:1.5;font-weight:600;margin-bottom:20px;}
  .scale-row{display:flex;gap:6px;justify-content:space-between;}
  .scale-btn{
    flex:1;aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    transition:all .12s ease;
  }
  .scale-btn.active{background:var(--teal-500);border-color:var(--teal-500);color:#fff;}
  .scale-caption{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:8px;}

  .option-btn{
    display:block;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;font-size:14.5px;line-height:1.4;
    cursor:pointer;color:var(--ink);font-family:'Manrope',sans-serif;
    transition:all .12s ease;
  }
  .option-btn.selected{border-color:var(--teal-500);background:var(--teal-100);}
  .option-btn.correct{border-color:var(--green-ok);background:var(--green-ok-bg);}
  .option-btn.incorrect{border-color:var(--red-ok);background:var(--red-ok-bg);}

  .result-hero{
    text-align:center;padding:30px 20px 22px 20px;border-radius:var(--radius);
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .result-hero.green{background:linear-gradient(160deg,var(--green-ok-bg),#fff);}
  .result-hero.amber{background:linear-gradient(160deg,var(--amber-ok-bg),#fff);}
  .result-hero.red{background:linear-gradient(160deg,var(--red-ok-bg),#fff);}
  .result-emoji{font-size:44px;margin-bottom:10px;}
  .result-title{font-size:21px;margin-bottom:6px;}
  .result-score{font-size:13px;color:var(--ink-soft);}
  .result-msg{
    background:#fff;border-radius:var(--radius-sm);padding:16px 18px;
    font-size:14.5px;line-height:1.6;color:var(--ink);
    border:1px solid var(--line); margin-bottom:16px;
  }
  .subscale-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .subscale-row:last-child{border-bottom:none;}
  .subscale-name{font-size:13.5px;color:var(--ink-soft);}
  .subscale-bar-wrap{flex:1;margin:0 12px;height:8px;background:var(--cream-2);border-radius:8px;overflow:hidden;}
  .subscale-bar{height:100%;border-radius:8px;background:var(--teal-400);}
  .subscale-val{font-size:13.5px;font-weight:700;width:34px;text-align:right;}

  .bottom-nav{
    position:sticky;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom)) 8px;
    max-width:480px;margin:0 auto;width:100%;
  }
  .nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:10px;
  }
  .nav-btn.active{color:var(--teal-700);}
  .nav-btn svg{width:22px;height:22px;}

  .fitness-icon{background:var(--teal-100);color:var(--teal-700);}
  .fitness-icon.jismoniy{background:#fdeee0;color:var(--coral-dark);}
  .fitness-icon.relaks{background:#f1e8f7;color:#8b5fa3;}

  .video-wrap{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;
    background:#000;
  }
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  .case-tag{
    display:inline-block;font-size:10.5px;font-weight:700;
    background:var(--teal-100);color:var(--teal-700);
    padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:0.02em;
  }

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .e-icon{font-size:36px;margin-bottom:10px;}

  .profile-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
  }
  .avatar{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(145deg,var(--teal-400),var(--teal-700));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;flex-shrink:0;
  }
  .profile-name{font-size:17px;margin-bottom:2px;}
  .profile-sub{font-size:12.5px;color:var(--ink-soft);}

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  }
  .pill.green{background:var(--green-ok-bg);color:var(--green-ok);}
  .pill.amber{background:var(--amber-ok-bg);color:var(--amber-ok);}
  .pill.red{background:var(--red-ok-bg);color:var(--red-ok);}

  .divider-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);font-weight:700;margin:22px 0 10px 2px;
  }

  .field-input{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Manrope',sans-serif;font-size:14.5px;color:var(--ink);
    background:var(--cream);outline:none;
  }
  .field-input:focus{border-color:var(--teal-400);}

  .badge-svg{width:96px;height:96px;margin:0 auto 10px auto;display:block;}

  ::-webkit-scrollbar{width:0;}
</style>
</head>

  <div id="app"></div>

/* Video havolasini o'rnatilgan (embed) player kodiga aylantiradi.
   YouTube (watch?v=, youtu.be/) va Google Drive (file/d/ID/view) havolalarini qo'llab-quvvatlaydi. */
function videoEmbedHtml(url){
  if(!url) return '';
  let embedSrc = null;
  const yt1 = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  const yt2 = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
  const drive = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(yt1) embedSrc = `https://www.youtube.com/embed/${yt1[1]}`;
  else if(yt2) embedSrc = `https://www.youtube.com/embed/${yt2[1]}`;
  else if(drive) embedSrc = `https://drive.google.com/file/d/${drive[1]}/preview`;
  else embedSrc = url; // boshqa to'g'ridan-to'g'ri havola bo'lsa, shunday sinab ko'ramiz

  return `<div class="video-wrap"><iframe src="${embedSrc}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
}

  };
  const result = {date:fmtDate(), EE, DP, PA, profil, level, msg:messages[level]};
  STATE.results.mbi = result; saveState();
  VIEW={name:'mbi_result'}; render();
}
function renderMbiResult(){
  const r = STATE.results.mbi;
  if(!r){ go({name:'mbi_intro'}); return; }
  const body = `
    ${topbar('Natijangiz','Kasbiy charchash', true)}
    <main>
      <div class="result-hero ${r.level}">
        ${badgeSvg(r.level)}
        <div class="result-title">${r.profil}</div>
        <p class="result-score">${fmtDate()}</p>
      </div>
      <div class="result-msg">${r.msg}</div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:12px;">Subshkalalar</div>
        <div class="subscale-row"><div class="subscale-name" style="flex:0 0 42%">Emotsional charchash</div><div class="subscale-bar-wrap"><div class="subscale-bar" style="width:${Math.min(100,r.EE/54*100)}%"></div></div><div class="subscale-val">${r.EE}</div></div>
        <div class="subscale-row"><div class="subscale-name" style="flex:0 0 42%">Depersonalizatsiya</div><div class="subscale-bar-wrap"><div class="subscale-bar" style="width:${Math.min(100,r.DP/30*100)}%"></div></div><div class="subscale-val">${r.DP}</div></div>
        <div class="subscale-row"><div class="subscale-name" style="flex:0 0 42%">Shaxsiy yutuqlar</div><div class="subscale-bar-wrap"><div class="subscale-bar" style="width:${Math.min(100,r.PA/48*100)}%"></div></div><div class="subscale-val">${r.PA}</div></div>
      </div>
      <button class="btn secondary" onclick="go({name:'home'})">Bosh sahifaga qaytish</button>
    </main>
    ${bottomNav('home')}
  `;
  document.getElementById('app').innerHTML = body;
}

/* ---------------- XEYM FLOW ---------------- */
function renderXeymIntro(){
  testIntro({
    title:'Stressga bardosh',
    headerSub:'Xeym (Coping) metodikasi',
    emoji:'🛡️',
    bgColor:'#f1e8f7',
    meta:'3 blok · har biridan bitta javob',
    desc:'Qiyin vaziyatda paydo bo\'ladigan fikr, his-tuyg\'u va harakatlaringiz haqida 3 ta bo\'limdan (Fikrlar, His-tuyg\'ular, Harakatlar) bittadan eng mos variantni tanlaysiz.',
    startFn:'startXeym'
  });
}
function startXeym(){ ANSWERS={}; VIEW={name:'xeym_q', idx:0}; render(); }
function renderXeymQuestion(idx){
  const total = XEYM_SECTIONS.length;
  const sec = XEYM_SECTIONS[idx];
  const current = ANSWERS[idx];
  const body = `
    ${topbar('Stressga bardosh', `Blok ${idx+1} / ${total}`, true)}
    <main>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div></div>
      <div class="eyebrow">${sec.key} bo'limi</div>
      <div class="section-title" style="font-size:17px;margin-bottom:16px;">${sec.title}</div>
      ${sec.items.map((it,i)=>`
        <button class="option-btn ${current===i?'selected':''}" onclick="answerXeym(${idx},${i})">${it.t}</button>
      `).join('')}
      <button class="btn" style="margin-top:8px" ${current===undefined?'disabled':''} onclick="nextXeym(${idx})">${idx===total-1?"Natijani ko'rish":'Keyingi blok'}</button>
    </main>
  `;
  document.getElementById('app').innerHTML = body;
}
function answerXeym(idx,i){ ANSWERS[idx]=i; renderXeymQuestion(idx); }
function nextXeym(idx){
  if(idx<XEYM_SECTIONS.length-1){ VIEW={name:'xeym_q', idx:idx+1}; render(); }
  else finishXeym();
}
function finishXeym(){
  let counts = {adaptiv:0, nisbiy:0, noadaptiv:0};
  let picks = [];
  XEYM_SECTIONS.forEach((sec,idx)=>{
    const item = sec.items[ANSWERS[idx]];
    counts[item.type]++;
    picks.push({sec:sec.key, text:item.t, type:item.type});
  });
  let level, label;
  if(counts.adaptiv>=2){level='green';label="Adaptiv (Samarali) strategiyalar ustunligi";}
  else if(counts.noadaptiv>=2){level='red';label="Noadaptiv (Samarasiz) strategiyalar ustunligi";}
  else {level='amber';label="Nisbiy adaptiv strategiyalar ustunligi";}
  const messages = {
    green:"Siz qiyinchiliklarni aql va xotirjamlik bilan yengasiz. Bu — kuchli fazilat! 💪",
    amber:"Siz vaziyatni yumshatishga harakat qilasiz, lekin ba'zan chuqurroq yechim ham kerak bo'ladi. 🤔",
    red:"Qiyin vaziyatlarda qo'llab-quvvatlash so'rashdan tortinmang. Yolg'iz emassiz. 🤍"
  };
  const result = {date:fmtDate(), level, label, msg:messages[level], picks};
  STATE.results.xeym = result; saveState();
  VIEW={name:'xeym_result'}; render();
}
function renderXeymResult(){
  const r = STATE.results.xeym;
  if(!r){ go({name:'xeym_intro'}); return; }
  const body = `
    ${topbar('Natijangiz','Stressga bardosh', true)}
    <main>
      <div class="result-hero ${r.level}">
        ${badgeSvg(r.level)}
        <div class="result-title">${r.label}</div>
        <p class="result-score">${fmtDate()}</p>
      </div>
      <div class="result-msg">${r.msg}</div>
      <button class="btn secondary" onclick="go({name:'home'})">Bosh sahifaga qaytish</button>
    </main>
    ${bottomNav('home')}
  `;
  document.getElementById('app').innerHTML = body;
}

/* ---------------- FITNES ---------------- */
function renderFitnes(){
  const typeMap = {nafas:{label:'Nafas', cls:''}, jismoniy:{label:'Jismoniy', cls:'jismoniy'}, relaks:{label:'Relaksatsiya', cls:'relaks'}};
  const body = `
    ${topbar('Fitnes','Kunlik qisqa mashqlar')}
    <main>
      <p class="section-sub">Kuniga 2-3 daqiqa ajratib, o'zingizga g'amxo'rlik qiling.</p>
      ${FITNES.map(f=>{
        const done = STATE.fitnesDone.includes(f.id);
        const tm = typeMap[f.turi];
        return `<div class="card test-card" onclick="go({name:'fitnes_detail', id:'${f.id}'})">
          <div class="test-icon fitness-icon ${tm.cls}">${f.icon}</div>
          <div><h3>${f.nomi} ${done?'✅':''}</h3><p>${tm.label} · ${f.daq} daqiqa</p></div>
          <div class="chev">${ICONS.chev}</div>
        </div>`;
      }).join('')}
    </main>
    ${bottomNav('fitnes')}
  `;
  document.getElementById('app').innerHTML = body;
}
function renderFitnesDetail(id){
  const f = FITNES.find(x=>x.id===id);
  const done = STATE.fitnesDone.includes(id);
  const body = `
    ${topbar(f.nomi, f.maqsad, true)}
    <main>
      ${videoEmbedHtml(f.video)}
      <div class="card">
        <div class="eyebrow">Yo'riqnoma</div>
        <p style="white-space:pre-line;font-size:14.5px;line-height:1.7;color:var(--ink)">${f.yoriqnoma}</p>
      </div>
      <button class="btn ${done?'secondary':'coral'}" onclick="toggleFitnesDone('${id}')">${done? "✅ Bajarildi (bekor qilish)" : "Bajardim"}</button>
    </main>
    ${bottomNav('fitnes')}
  `;
  document.getElementById('app').innerHTML = body;
}
function toggleFitnesDone(id){
  const i = STATE.fitnesDone.indexOf(id);
  if(i>-1) STATE.fitnesDone.splice(i,1); else STATE.fitnesDone.push(id);
  saveState();
  renderFitnesDetail(id);
}

/* ---------------- CASES ---------------- */
function renderCases(){
  const body = `
    ${topbar('Cases','Amaliy pedagogik vaziyatlar')}
    <main>
      <p class="section-sub">Real vaziyatlarni o'qing va eng maqbul yechimni tanlang.</p>
      ${CASES.map(c=>{
        const done = STATE.casesDone[c.id];
        return `<div class="card test-card" onclick="go({name:'case_detail', id:'${c.id}'})">
          <div class="test-icon" style="background:var(--cream-2);color:var(--ink-soft)">🎯</div>
          <div><h3>${c.sarlavha} ${done?(done.correct?'✅':'🔁'):''}</h3><p>${c.vaziyat.slice(0,50)}...</p></div>
          <div class="chev">${ICONS.chev}</div>
        </div>`;
      }).join('')}
    </main>
    ${bottomNav('cases')}
  `;
  document.getElementById('app').innerHTML = body;
}
function renderCaseDetail(id){
  const c = CASES.find(x=>x.id===id);
  const done = STATE.casesDone[id];
  const body = `
    ${topbar(c.sarlavha,'Vaziyatni o\'qib, javob tanlang', true)}
    <main>
      <div class="card">
        <div class="case-tag">Vaziyat</div>
        <p style="margin:0;font-size:14.5px;line-height:1.6">${c.vaziyat}</p>
      </div>
      ${Object.keys(c.variants).map(k=>{
        let cls='';
        if(done){
          if(k===c.togri) cls='correct';
          else if(k===done.choice) cls='incorrect';
        } else if(done===undefined && ANSWERS.pick===k) cls='selected';
        return `<button class="option-btn ${cls}" ${done?'disabled':''} onclick="pickCase('${id}','${k}')"><b>${k})</b> ${c.variants[k]}</button>`;
      }).join('')}
      ${done ? `<div class="result-msg" style="margin-top:6px;"><b>${done.correct?"To'g'ri javob! ✅":"Boshqa fikr, lekin bu ham o'rganish imkoniyati ⚠️"}</b><br><br>${c.izoh}</div>
        <button class="btn secondary" onclick="go({name:'cases'})">Cases ro'yxatiga qaytish</button>` : ''}
    </main>
    ${bottomNav('cases')}
  `;
  document.getElementById('app').innerHTML = body;
}
function pickCase(id, choice){
  const c = CASES.find(x=>x.id===id);
  STATE.casesDone[id] = {choice, correct: choice===c.togri, date:fmtDate()};
  saveState();
  renderCaseDetail(id);
}

/* ---------------- PROFIL ---------------- */
function renderProfil(){
  const r = STATE.results;
  const doneCount = STATE.fitnesDone.length;
  const casesCount = Object.keys(STATE.casesDone).length;
  function miniCard(title, data, goName){
    if(!data){
      return `<div class="card">
        <h3 style="font-size:14.5px;margin-bottom:4px;">${title}</h3>
        <p style="margin:0;font-size:13px;color:var(--ink-soft)">Hali test ishlanmagan</p>
        <button class="btn secondary" style="margin-top:12px" onclick="go({name:'${goName}'})">Testni boshlash</button>
      </div>`;
    }
    const label = data.label || data.profil;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <h3 style="font-size:14.5px;margin-bottom:6px;">${title}</h3>
        <span class="pill ${data.level}">${label}</span>
      </div>
      <p style="margin:0;font-size:12.5px;color:var(--ink-soft)">${data.date}</p>
    </div>`;
  }
  const p = STATE.profile;
  const initial = (p.name||'P').trim().charAt(0).toUpperCase();
  const metaBits = [];
  if(p.age) metaBits.push(p.age + ' yosh');
  if(p.staj) metaBits.push(p.staj + ' yillik staj');
  const body = `
    ${topbar('Profil','Sizning yo\'lingiz')}
    <main>
      <div class="profile-header">
        <div class="avatar">${initial}</div>
        <div>
          <div class="profile-name">${p.name || 'Pedagog'}</div>
          <div class="profile-sub">${metaBits.join(' · ') || 'Ma\'lumot kiritilmagan'}</div>
        </div>
      </div>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <div style="font-size:12.5px;color:var(--ink-soft)">${doneCount} ta mashq bajarildi · ${casesCount} ta keys yechildi</div>
        <button class="btn secondary" style="width:auto;padding:8px 14px;font-size:12.5px;" onclick="go({name:'edit_profile'})">Tahrirlash</button>
      </div>
      <div class="divider-label">Diagnostika natijalari</div>
      ${miniCard('Emotsional Intellekt', r.xoll, 'xoll_intro')}
      ${miniCard('Kasbiy charchash', r.mbi, 'mbi_intro')}
      ${miniCard('Stressga bardosh', r.xeym, 'xeym_intro')}
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}

function renderEditProfile(){
  const p = STATE.profile;
  const body = `
    ${topbar('Ma\'lumotlarni tahrirlash','', true)}
    <main>
      <div class="card">
        <div class="eyebrow">Ism</div>
        <input id="ep-name" class="field-input" type="text" value="${p.name||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Yosh</div>
        <input id="ep-age" class="field-input" type="number" value="${p.age||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Pedagogik staj (yil)</div>
        <input id="ep-staj" class="field-input" type="number" value="${p.staj||''}"/>
      </div>
      <button class="btn" onclick="saveEditProfile()">Saqlash</button>
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}
function saveEditProfile(){
  const name = document.getElementById('ep-name').value.trim();
  const age = document.getElementById('ep-age').value.trim();
  const staj = document.getElementById('ep-staj').value.trim();
  if(!name){ alert("Iltimos, ismingizni kiriting"); return; }
  STATE.profile = {name, age, staj};
  saveState();
  go({name:'profil'});
}

/* ---------------- ROUTER ---------------- */
function render(){
  switch(VIEW.name){
    case 'onboarding': return renderOnboarding();
    case 'home': return renderHome();
    case 'xoll_intro': return renderXollIntro();
    case 'xoll_q': return renderXollQuestion(VIEW.idx);
    case 'xoll_result': return renderXollResult();
    case 'mbi_intro': return renderMbiIntro();
    case 'mbi_q': return renderMbiQuestion(VIEW.idx);
    case 'mbi_result': return renderMbiResult();
    case 'xeym_intro': return renderXeymIntro();
    case 'xeym_q': return renderXeymQuestion(VIEW.idx);
    case 'xeym_result': return renderXeymResult();
    case 'fitnes': return renderFitnes();
    case 'fitnes_detail': return renderFitnesDetail(VIEW.id);
    case 'cases': return renderCases();
    case 'case_detail': return renderCaseDetail(VIEW.id);
    case 'profil': return renderProfil();
    case 'edit_profile': return renderEditProfile();
    default: return renderHome();
  }
}
render();
</script>
</body>
