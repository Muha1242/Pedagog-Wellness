<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedagog Wellness</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832;
    --teal-700:#1f5c52;
    --teal-500:#2f8577;
    --teal-400:#4a9b8e;
    --teal-200:#a9d4c9;
    --teal-100:#e2f2ee;
    --cream:#faf8f4;
    --cream-2:#f2efe7;
    --coral:#f2a15a;
    --coral-dark:#e0813a;
    --rose:#e88a7d;
    --ink:#1c2b28;
    --ink-soft:#4c5c58;
    --line: #e4ded2;
    --green-ok:#5c9a72;
    --green-ok-bg:#e9f4ec;
    --amber-ok:#c98a2e;
    --amber-ok-bg:#faf1de;
    --red-ok:#c0654f;
    --red-ok-bg:#fbeae5;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px -12px rgba(18,56,50,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: var(--shadow);
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 14px 20px;
    background: linear-gradient(180deg, var(--teal-900) 0%, var(--teal-700) 100%);
    color:#fff;
    border-radius: 0 0 26px 26px;
    position:relative;
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute;
    right:-40px; top:-60px;
    width:180px;height:180px;
    background: radial-gradient(circle, rgba(242,161,90,0.35), transparent 70%);
  }
  .logo-mark{
    width:44px;height:44px;border-radius:14px;
    background: rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo-mark svg{width:26px;height:26px;}
  header.topbar .titles{position:relative;z-index:1;}
  header.topbar h1{font-size:19px;color:#fff;}
  header.topbar p{margin:2px 0 0 0;font-size:12.5px;color:var(--teal-200);}
  .back-btn{
    background:rgba(255,255,255,0.16);
    border:none;color:#fff;width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:18px;flex-shrink:0;
  }
  main{
    flex:1;
    padding: 18px 18px 100px 18px;
    overflow-y:auto;
  }
  .eyebrow{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.09em;
    color:var(--teal-500);
    font-weight:700;
    margin-bottom:6px;
  }
  .section-title{font-size:22px;margin-bottom:4px;}
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px 0;line-height:1.5;}

  .card{
    background:#fff;
    border-radius: var(--radius);
    padding:18px;
    box-shadow: 0 6px 18px -10px rgba(18,56,50,0.14);
    border:1px solid var(--line);
    margin-bottom:14px;
  }
  .test-card{
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .test-card:active{transform:scale(0.98);}
  .test-icon{
    width:52px;height:52px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  .test-card h3{font-size:16px;margin-bottom:2px;}
  .test-card p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .chev{margin-left:auto;color:var(--teal-400);font-size:20px;flex-shrink:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background: var(--teal-500);
    color:#fff;border:none;border-radius:14px;
    padding:14px 20px;font-size:15px;font-weight:700;
    cursor:pointer;width:100%;
    font-family:'Manrope',sans-serif;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:hover{background:var(--teal-700);}
  .btn.secondary{
    background:transparent;color:var(--teal-700);border:1.5px solid var(--teal-400);
  }
  .btn.coral{background:var(--coral);}
  .btn.coral:hover{background:var(--coral-dark);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  .progress-wrap{margin-bottom:18px;}
  .progress-bar{height:6px;background:var(--cream-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--teal-400),var(--coral));border-radius:6px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-align:right;}

  .question-card{
    background:#fff;border-radius:var(--radius);padding:22px 20px;
    border:1px solid var(--line);margin-bottom:20px;
  }
  .question-text{font-size:16.5px;line-height:1.5;font-weight:600;margin-bottom:20px;}
  .scale-row{display:flex;gap:6px;justify-content:space-between;}
  .scale-btn{
    flex:1;aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    transition:all .12s ease;
  }
  .scale-btn.active{background:var(--teal-500);border-color:var(--teal-500);color:#fff;}
  .scale-caption{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:8px;}

  .option-btn{
    display:block;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;font-size:14.5px;line-height:1.4;
    cursor:pointer;color:var(--ink);font-family:'Manrope',sans-serif;
    transition:all .12s ease;
  }
  .option-btn.selected{border-color:var(--teal-500);background:var(--teal-100);}
  .option-btn.correct{border-color:var(--green-ok);background:var(--green-ok-bg);}
  .option-btn.incorrect{border-color:var(--red-ok);background:var(--red-ok-bg);}

  .result-hero{
    text-align:center;padding:30px 20px 22px 20px;border-radius:var(--radius);
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .result-hero.green{background:linear-gradient(160deg,var(--green-ok-bg),#fff);}
  .result-hero.amber{background:linear-gradient(160deg,var(--amber-ok-bg),#fff);}
  .result-hero.red{background:linear-gradient(160deg,var(--red-ok-bg),#fff);}
  .result-emoji{font-size:44px;margin-bottom:10px;}
  .result-title{font-size:21px;margin-bottom:6px;}
  .result-score{font-size:13px;color:var(--ink-soft);}
  .result-msg{
    background:#fff;border-radius:var(--radius-sm);padding:16px 18px;
    font-size:14.5px;line-height:1.6;color:var(--ink);
    border:1px solid var(--line); margin-bottom:16px;
  }
  .subscale-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .subscale-row:last-child{border-bottom:none;}
  .subscale-name{font-size:13.5px;color:var(--ink-soft);}
  .subscale-bar-wrap{flex:1;margin:0 12px;height:8px;background:var(--cream-2);border-radius:8px;overflow:hidden;}
  .subscale-bar{height:100%;border-radius:8px;background:var(--teal-400);}
  .subscale-val{font-size:13.5px;font-weight:700;width:34px;text-align:right;}

  .bottom-nav{
    position:sticky;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom)) 8px;
    max-width:480px;margin:0 auto;width:100%;
  }
  .nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-family:'Manrope',sans-serif;font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:10px;
  }
  .nav-btn.active{color:var(--teal-700);}
  .nav-btn svg{width:22px;height:22px;}

  .fitness-icon{background:var(--teal-100);color:var(--teal-700);}
  .fitness-icon.jismoniy{background:#fdeee0;color:var(--coral-dark);}
  .fitness-icon.relaks{background:#f1e8f7;color:#8b5fa3;}

  .video-wrap{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;
    background:#000;
  }
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  .video-open-card{
    display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--teal-700),var(--teal-500));
    color:#fff;border-radius:var(--radius-sm);padding:16px;margin-bottom:14px;text-decoration:none;
  }
  .video-open-icon{
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .video-open-title{font-size:14px;font-weight:700;}
  .video-open-sub{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:1px;}

  .breath-card{text-align:center;}
  .breath-stage{display:flex;align-items:center;justify-content:center;padding:20px 0;}
  .breath-circle{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--teal-200), var(--teal-500));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:12.5px;text-align:center;padding:10px;
    box-shadow:0 8px 24px -8px rgba(47,133,119,0.5);
  }
  .breath-stage.walk-mode{flex-direction:column;gap:14px;}
  .walk-icon{font-size:44px;height:70px;display:flex;align-items:center;justify-content:center;}
  .walk-icon #walk-emoji{display:inline-block;}
  .walk-icon #walk-emoji.bounce{animation:walkBounce 0.55s ease-in-out infinite;}
  @keyframes walkBounce{
    0%,100%{transform:translateX(-14px) rotate(-10deg);}
    50%{transform:translateX(14px) rotate(10deg);}
  }
  .walk-label{font-size:13.5px;font-weight:700;color:var(--teal-700);}

  .case-tag{
    display:inline-block;font-size:10.5px;font-weight:700;
    background:var(--teal-100);color:var(--teal-700);
    padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:0.02em;
  }

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .e-icon{font-size:36px;margin-bottom:10px;}

  .profile-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;
  }
  .profile-header{
    display:flex;align-items:center;gap:14px;margin-bottom:20px;position:relative;
  }
  .profile-hero{
    background:linear-gradient(160deg,var(--teal-100),#fff);
    border-radius:var(--radius);padding:18px;margin-bottom:8px;border:1px solid var(--line);
  }
  .edit-fab{
    margin-left:auto;background:#fff;border:1px solid var(--line);width:36px;height:36px;
    border-radius:10px;font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .reward-strip{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;
    border:1px solid var(--line);
  }
  .reward-emoji{font-size:30px;flex-shrink:0;}
  .reward-badge-img{width:52px;height:52px;flex-shrink:0;}
  .reward-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .reward-note{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .today-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;
  }
  .today-stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;
  }
  .today-num{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-700);font-weight:600;}
  .today-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .today-num{font-family:'Fraunces',serif;font-size:24px;color:var(--teal-700);font-weight:600;}
  .today-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .routine-card{padding-bottom:10px;}
  .routine-summary{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--teal-100);border-radius:12px;padding:10px 12px;margin-bottom:12px;
    font-size:12.5px;color:var(--teal-900);line-height:1.4;
  }
  .routine-close{background:none;border:none;color:var(--teal-700);font-size:14px;cursor:pointer;flex-shrink:0;}
  .routine-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  }
  .routine-row:last-child{border-bottom:none;}
  .routine-icon{font-size:20px;flex-shrink:0;width:30px;text-align:center;}
  .routine-mid{flex:1;min-width:0;}
  .routine-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .routine-time{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .routine-desc{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .routine-status{font-size:11px;font-weight:700;flex-shrink:0;color:var(--ink-soft);}
  .routine-row.r-active .routine-title{color:var(--teal-700);}
  .routine-row.r-done .routine-status{color:var(--green-ok);}
  .routine-row.r-missed .routine-status{color:var(--red-ok);}
  .routine-row.r-pending{opacity:0.55;}
  .routine-btn{
    background:var(--coral);color:#fff;border:none;border-radius:10px;
    padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;
    font-family:'Manrope',sans-serif;
  }
  .routine-edit-link{background:none;border:none;color:var(--teal-500);font-size:12px;font-weight:700;cursor:pointer;}
  .routine-del-btn{background:none;border:none;font-size:16px;cursor:pointer;flex-shrink:0;}

  .avatar{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(145deg,var(--teal-400),var(--teal-700));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;flex-shrink:0;
  }
  .profile-name{font-size:17px;margin-bottom:2px;}
  .profile-sub{font-size:12.5px;color:var(--ink-soft);}

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;
  }
  .pill.green{background:var(--green-ok-bg);color:var(--green-ok);}
  .pill.amber{background:var(--amber-ok-bg);color:var(--amber-ok);}
  .pill.red{background:var(--red-ok-bg);color:var(--red-ok);}

  .divider-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-soft);font-weight:700;margin:22px 0 10px 2px;
  }

  .field-input{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Manrope',sans-serif;font-size:14.5px;color:var(--ink);
    background:var(--cream);outline:none;
  }
  .field-input:focus{border-color:var(--teal-400);}

  .reaction-card{
    background:linear-gradient(160deg,var(--teal-100),#fff);
    border-radius:var(--radius);padding:22px 18px;text-align:center;
    margin-top:14px;border:1px solid var(--line);
  }
  .reaction-emoji{font-size:42px;display:inline-block;margin-bottom:8px;}
  .reaction-line{margin:0;font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5;}
  @keyframes reactLaugh{
    0%,100%{transform:rotate(0deg) scale(1);}
    20%{transform:rotate(-12deg) scale(1.15);}
    40%{transform:rotate(10deg) scale(1.1);}
    60%{transform:rotate(-8deg) scale(1.15);}
    80%{transform:rotate(6deg) scale(1.05);}
  }
  @keyframes reactWarm{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  .react-laugh{animation:reactLaugh 0.9s ease-in-out 2;}
  .react-warm{animation:reactWarm 1.4s ease-in-out 2;}

  .badge-svg{width:96px;height:96px;margin:0 auto 10px auto;display:block;}

  ::-webkit-scrollbar{width:0;}
</style>
</head>

<div id="shell">
  <div id="app"></div>
</div>

<script>
/* ---------------- DATA: XOLL (EQ) ---------------- */
const XOLL_QUESTIONS = [
"Men uchun salbiy his-tuyg'ular (g'azab, xafagarchilik, qo'rquv) hayotda nimalarni o'zgartirishim kerakligini ko'rsatuvchi muhim signaldir.",
"Mening salbiy his-tuyg'ularim menga zarar yetkazishidan oldin ularni to'xtata olaman.",
"Men o'z kayfiyatimni mustaqil ravishda yaxshilay olaman, buning uchun tashqi muhitga (boshqalarga) qarab qolmayman.",
"Men boshqa odamlarning qanday his-tuyg'ularni boshdan kechirayotganini tushunishga qodirman.",
"Agar kerak bo'lsa, men suhbatdoshimning xohish-istaklarini ularning so'zlarisiz ham (imo-ishora, nigohidan) anglay olaman.",
"Men o'z his-tuyg'ularim hayotimdagi muayyan maqsadlarga erishishga qanday ta'sir qilishini aniq bilaman.",
"Ruhiy tushkunlikka tushganimda, men tushkunlik sababini aniq tushuna olaman.",
"Men o'z his-tuyg'ularimni jilovlay olaman va osonlikcha o'zimdan chiqib ketmayman.",
"Men o'zimni har qanday ishni bajarishga osongina safarbar qila olaman (motivatsiya bera olaman).",
"Men boshqa odamlarning his-tuyg'ulari va kechinmalariga befarq emasman, ularga sherik bo'la olaman.",
"Men atrofimdagilar nimalarni his qilayotganini juda noziklik bilan seza olaman.",
"Men nima uchun o'zimga nisbatan qanday his-tuyg'uda ekanligimni aniq tushunaman.",
"Muammoli vaziyatga duch kelganda, men eng birinchi navbatda diqqatni his-tuyg'ularga emas, balki muammoning yechimiga qarata olaman.",
"Hayotdagi muvaffaqiyatsizliklar oldida men taslim bo'lmayman, aksincha, menda g'ayrat yanada ortadi.",
"Men yaqinlarim yoki hamkasblarimning ichki ruhiy holatini ularning yuz ifodasidan darrov o'qiyman.",
"Men his-tuyg'ularim o'zgarganini (masalan, jahl kelayotganini) u boshlanishidan avvalroq seza boshlayman.",
"Men o'z salbiy emotsiyalarimdan tezda xalos bo'lish ko'nikmasiga egaman.",
"Hatto eng murakkab sharoitda ham maqsadim sari intilishda davom etish uchun o'zimda kuch topa olaman.",
"Men boshqalarning imo-ishoralari va harakatlaridagi yashirin ma'nolarni (his-tuyg'ularni) oson ilg'ayman.",
"Men odamlarni tushunishda faqat so'zlarga emas, balki ularning ichki kayfiyatiga ham tayanaman.",
"Men o'z his-tuyg'ularimni atrofdagilarga tushunarli tarzda (so'z bilan) tushuntirib bera olaman.",
"Men o'zimning asabiy va bezovta holatimni boshqara olaman.",
"Men o'z maqsadlarimga erishish uchun his-tuyg'ularimni yo'naltira olaman (foydalana olaman).",
"Atrofdagilar xafa bo'lishganda, men ularning dardini o'zimniki kabi his qila olaman.",
"Men boshqa odamlarning kayfiyati nima sababdan yomonlashganini yaxshi tushunaman.",
"Men har doim aynan hozirgi daqiqada qanday emotsional holatda ekanligimni aniq bilaman.",
"Men g'azab va qaysarlik kabi hissiyotlarimni o'z vaqtida jilovlay olaman.",
"Agar ish o'xshamasa ham, men baribir o'z ishimga sodiq qolaman va davom ettiraman.",
"Men boshqalarning ko'zlariga qarab, ularning chin dildan gapirayotganini yoki yolg'on gapirayotganini seza olaman.",
"Men guruhda (jamoada) odamlar orasidagi emotsional muhitni (taranglik yoki xursandchilik) darrov tushunaman."
];
const XOLL_SCALES = [

/* Video havolasini o'rnatilgan (embed) player kodiga aylantiradi.
   YouTube (watch?v=, youtu.be/) va Google Drive (file/d/ID/view) havolalarini qo'llab-quvvatlaydi. */
function videoEmbedHtml(url){
  if(!url) return '';
  const yt1 = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  const yt2 = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
  const drive = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);

  if(yt1 || yt2){
    const embedSrc = `https://www.youtube.com/embed/${(yt1||yt2)[1]}`;
    return `<div class="video-wrap"><iframe src="${embedSrc}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
  }
  if(drive){
    // Google Drive iframe ko'plab muhitlarda (jumladan Telegram ichida) ishlamaydi,
    // shuning uchun ishonchli "yangi oynada ochish" kartochkasi ko'rsatamiz.
    const openUrl = `https://drive.google.com/file/d/${drive[1]}/view`;
    return `<a href="${openUrl}" target="_blank" rel="noopener" class="video-open-card">
      <div class="video-open-icon">▶</div>
      <div><div class="video-open-title">Video ko'rsatmani ko'rish</div><div class="video-open-sub">Yangi oynada ochiladi</div></div>
    </a>`;
  }
  return `<div class="video-wrap"><iframe src="${url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
}

/* ---------------- STATE ---------------- */
const LS_KEY = "pedagog_wellness_v1";
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if(TG){ TG.ready(); TG.expand(); }

function defaultState(){ return {results:{}, fitnesDone:[], casesDone:{}, profile:{name:"", age:"", staj:"", email:""}, routine:{}}; }
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(!s) return defaultState();
    if(!s.profile) s.profile = {name:"", age:"", staj:"", email:""};
    if(!s.routine) s.routine = {};
    return s;
  }
  catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
  if(TG && TG.CloudStorage){ TG.CloudStorage.setItem(LS_KEY, JSON.stringify(STATE), function(){}); }
}
let STATE = loadState();
let VIEW = {name: STATE.profile.name ? "home" : "onboarding"};
let ANSWERS = {};

/* Telegram CloudStorage'dan holatni tekshirib, agar u yerda mavjud bo'lsa (localStorage tozalangan bo'lsa ham) tiklaydi. */
function bootFromCloud(){
  if(!(TG && TG.CloudStorage)) { render(); return; }
  TG.CloudStorage.getItem(LS_KEY, function(err, value){
    if(!err && value){
      try{
        const cloud = JSON.parse(value);
        if(cloud && cloud.profile && cloud.profile.name){
          STATE = cloud;
          if(!STATE.routine) STATE.routine = {};
          VIEW = {name:"home"};
        }
      }catch(e){}
    }
    render();
  });
}

/* ---------------- RESULT BADGES (illustrated, not plain emoji) ---------------- */
function badgeSvg(level){
  const palettes = {
    green:{a:'#7fc79a', b:'#3f8f66'},
    amber:{a:'#f3c26a', b:'#d99a2e'},
    red:{a:'#f0a08e', b:'#d8674f'}
  };
  const c = palettes[level] || palettes.green;
  const icons = {
    green: `<path d="M32 47l9 9 17-19" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
    amber: `<path d="M28 50c4-14 12-20 24-22" stroke="#fff" stroke-width="4.2" stroke-linecap="round" fill="none"/>
            <path d="M46 26l6 2-2 6" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
    red: `<path d="M48 48c-9 6-9 6-16 0-5-4-5-11 0-14 3-2 7-1 8 2 1-3 5-4 8-2 5 3 5 10 0 14z" fill="#fff"/>`
  };
  return `<svg class="badge-svg" viewBox="0 0 96 96" fill="none">
    <circle cx="48" cy="48" r="46" fill="url(#g-${level})"/>
    <defs><radialGradient id="g-${level}" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="${c.a}"/><stop offset="100%" stop-color="${c.b}"/>
    </radialGradient></defs>
    ${icons[level] || icons.green}
  </svg>`;
}

async function syncSave(){
  if(!CONFIG.API_URL || !STATE.profile.email) return;
  const chatId = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) ? TG.initDataUnsafe.user.id : '';
  try{

      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},

async function logResult(testName, level, label, details){
  if(!CONFIG.API_URL || !STATE.profile.email) return;
  try{
    await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'log', email: STATE.profile.email, profile: STATE.profile, testName, level, label, details})

  }catch(e){ console.warn('Log xato:', e); }

async function syncLoad(email){
  if(!CONFIG.API_URL || !email) return null;
  try{
    const res = await fetch(`${CONFIG.API_URL}?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    if(data.status === 'ok') return data.state;
    return null;
  }catch(e){ console.warn('Yuklash xato:', e); return null; }
}

/* ---------------- KUN TARTIBI (foydalanuvchi o'zi tuzadi, Toshkent vaqti UTC+5) ---------------- */
function tashkentNowStr(){
  const d = new Date(Date.now() + 5*3600*1000);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}
function tashkentDateKey(offsetDays){
  offsetDays = offsetDays || 0;
  const d = new Date(Date.now() + 5*3600*1000 + offsetDays*86400000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function getRoutineSchedule(){
  return (STATE.customRoutine || []).slice().sort((a,b)=> a.time.localeCompare(b.time));
}
function routineStatus(schedule, idx, todayKey){
  const nowStr = tashkentNowStr();
  const item = schedule[idx];
  const done = STATE.routine[todayKey] && STATE.routine[todayKey][item.id];
  if(done) return 'done';
  const nextTime = schedule[idx+1] ? schedule[idx+1].time : '23:59';
  if(nowStr < item.time) return 'pending';
  if(nowStr < nextTime) return 'active';
  return 'missed';
}
function markRoutineDone(id){
  const key = tashkentDateKey(0);
  if(!STATE.routine[key]) STATE.routine[key] = {};
  STATE.routine[key][id] = true;
  saveState(); syncSave();
  render();
}
function dismissRoutineSummary(dateKey){
  if(!STATE.routineSummarySeen) STATE.routineSummarySeen = {};
  STATE.routineSummarySeen[dateKey] = true;
  saveState();
  render();
}
function routineWidgetHtml(){
  const schedule = getRoutineSchedule();
  if(schedule.length === 0){
    return `<div class="card routine-card" style="text-align:center;">
      <div style="font-size:28px;margin-bottom:6px;">🗓️</div>
      <p style="margin:0 0 12px 0;font-size:13.5px;color:var(--ink-soft)">Kun tartibingiz hali bo'sh. O'z rejalaringizni kiriting — ilova ularni vaqti-vaqtida eslatib turadi.</p>
      <button class="btn secondary" onclick="go({name:'routine_edit'})">+ Reja qo'shish</button>
    </div>`;
  }
  const todayKey = tashkentDateKey(0);
  const statusMeta = {
    pending:{label:'Kutilmoqda', cls:'r-pending'},
    active:{label:'Hozir', cls:'r-active'},
    done:{label:'Bajarildi ✅', cls:'r-done'},
    missed:{label:'Bajarilmadi', cls:'r-missed'}
  };
  const items = schedule.map((item, idx)=>{
    const st = routineStatus(schedule, idx, todayKey);
    const meta = statusMeta[st];
    return `<div class="routine-row ${meta.cls}">
      <div class="routine-icon">${item.icon||'⏰'}</div>
      <div class="routine-mid">
        <div class="routine-title">${item.title} <span class="routine-time">${item.time}</span></div>
        ${item.desc ? `<div class="routine-desc">${item.desc}</div>` : ''}
      </div>
      ${st==='active' ? `<button class="routine-btn" onclick="markRoutineDone('${item.id}')">Bajardim</button>` : `<span class="routine-status">${meta.label}</span>`}
    </div>`;
  }).join('');

  const yKey = tashkentDateKey(-1);
  let summaryHtml = '';
  if(STATE.routine[yKey] && (!STATE.routineSummarySeen || !STATE.routineSummarySeen[yKey])){
    const doneCount = schedule.filter(it=>STATE.routine[yKey][it.id]).length;
    const total = schedule.length;
    let msg;
    if(doneCount===total) msg = "Kecha barcha rejalarni bajardingiz! Ajoyib intizom 🌟";
    else if(doneCount===0) msg = "Kecha birorta rejani bajarolmadingiz — bugun qaytadan boshlaymiz, hammasi joyida 🤍";
    else msg = `Kecha ${doneCount}/${total} rejani bajardingiz — yaxshi natija, davom eting 💪`;
    summaryHtml = `<div class="routine-summary">
      <span>${msg}</span>
      <button class="routine-close" onclick="dismissRoutineSummary('${yKey}')">✕</button>
    </div>`;
  }

  return `<div class="card routine-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="eyebrow" style="margin-bottom:0;">Kun tartibi</div>
      <button class="routine-edit-link" onclick="go({name:'routine_edit'})">Sozlash</button>
    </div>
    ${summaryHtml}
    ${items}
  </div>`;
}

  else pool = MOTIVATION_POOLS.evening;
  return pool[dayIdx % pool.length];
}

function startXoll(){

function renderXollQuestion(idx){
  const total = XOLL_QUESTIONS.length;
  const q = XOLL_QUESTIONS[idx];
  const current = ANSWERS[idx];
  const scale = [-3,-2,-1,1,2,3];
  const body = `
    ${topbar('Emotsional Intellekt', `Savol ${idx+1} / ${total}`, true)}
    <main>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div>
      </div>
      <div class="question-card">
        <div class="question-text">${q}</div>
        <div class="scale-row">
          ${scale.map(v => `<button class="scale-btn ${current===v?'active':''}" onclick="answerXoll(${idx},${v})">${v>0?'+'+v:v}</button>`).join('')}
        </div>
        <div class="scale-caption"><span>To'liq qo'shilmayman</span><span>To'liq qo'shilaman</span></div>
      </div>
      <button class="btn" ${current===undefined?'disabled':''} onclick="nextXoll(${idx})">${idx===total-1?'Natijani ko\'rish':'Keyingisi'}</button>
    </main>
  `;
  document.getElementById('app').innerHTML = body;
}
function answerXoll(idx,val){ ANSWERS[idx]=val; renderXollQuestion(idx); }
function nextXoll(idx){
  if(idx < XOLL_QUESTIONS.length-1){ VIEW={name:'xoll_q', idx:idx+1}; render(); }
  else{ finishXoll(); }
}
function finishXoll(){
  const scaleResults = XOLL_SCALES.map(s=>{
    const sum = s.items.reduce((a,qNum)=> a + (ANSWERS[qNum-1]||0), 0);
    return {name:s.name, val:sum};
  });
  const total = scaleResults.reduce((a,s)=>a+s.val,0);
  let level, label;
  if(total>=70){level='green';label="Yuqori darajadagi Emotsional Intellekt";}
  else if(total>=40){level='amber';label="O'rta darajadagi Emotsional Intellekt";}
  else {level='red';label="Past darajadagi Emotsional Intellekt";}
  const messages = {
    green:"Ajoyib natija! Emotsional zukkoligingiz yuqori darajada — bu kasbiy va shaxsiy hayotingizda katta kuch. 🌟",
    amber:"Yaxshi natija! Emotsional intellektingizni yanada rivojlantirish uchun kichik mashqlar foyda beradi. 💫",
    red:"Bu boshlang'ich nuqta, xolos. Emotsional intellekt — o'rganish mumkin bo'lgan ko'nikma. Har kuni kichik qadam tashlang. 🌱"
  };
  const result = {date:fmtDate(), total, level, label, msg:messages[level], scales:scaleResults};
  STATE.results.xoll = result; saveState();
  syncSave();
  logResult('Xoll (EQ)', level, label, {total, scales:scaleResults});
  VIEW = {name:'xoll_result'}; render();
}

    ]
  },
  iliq: {
    keywords:["rahmat","minnatdor","mehr","iliq","yaxshi","sevindim","xursand","quvondim","yoqdi","baxtli"],
    emoji:"🥰", anim:"react-warm",
    lines:[
      "Voy, bu juda yoqimli ekan 🥰",
      "Shunday iliq lahzalar kunni yoritadi ✨",
      "O'qib turib men ham xursand bo'ldim 💛"
    ]
  },
  qiyin: {
    keywords:["charchadim","qiyin","stress","asabiy","charchagan","toliqqan","og'ir","qiynaldim"],
    emoji:"🤍", anim:"react-warm",
    lines:[
      "Bunday kunlar ham bo'ladi. Siz baribir shu daqiqani topib, yozganingiz uchun rahmat 🤍",
      "Charchoqqa qaramay, o'zingizga vaqt ajratganingiz — bu allaqachon yutuq 🌱"
    ]
  },
  standart: {
    keywords:[],
    emoji:"🌸", anim:"react-warm",
    lines:[
      "Ajoyib lahza ekan, baham ko'rganingiz uchun rahmat 🌸",
      "Kichik quvonchlar — katta baxtning boshlanishi 🌿",
      "Buni yozganingiz uchun rahmat, kayfiyatingiz ko'tarilsin! ✨"
    ]
  }
};
function analyzeJournal(text){
  const low = text.toLowerCase();
  for(const key of ["kulgili","iliq","qiyin"]){
    const pool = REACTION_POOLS[key];
    if(pool.keywords.some(k=>low.includes(k))){
      return {emoji:pool.emoji, anim:pool.anim, line: pool.lines[Math.floor(Math.random()*pool.lines.length)]};
    }
  }
  const pool = REACTION_POOLS.standart;
  return {emoji:pool.emoji, anim:pool.anim, line: pool.lines[Math.floor(Math.random()*pool.lines.length)]};
}

let BREATH_TIMER = null;
function breathWidgetHtml(pattern, visualType){
  if(visualType === 'walk'){

      <div class="eyebrow">Animatsion yo'lboshchi</div>
      <div class="breath-stage walk-mode">

    </div>`;
  }
  return `<div class="card breath-card">
    <div class="eyebrow">Animatsion yo'lboshchi</div>
    <div class="breath-stage">
      <div class="breath-circle" id="breath-circle"><span id="breath-label">Boshlash uchun bosing</span></div>
    </div>
    <button class="btn secondary" id="breath-toggle-btn" onclick="toggleBreathAnim('circle')">Boshlash</button>
  </div>`;
}
function toggleBreathAnim(mode){
  const btn = document.getElementById('breath-toggle-btn');
  if(BREATH_TIMER){
    clearTimeout(BREATH_TIMER); BREATH_TIMER = null;
    document.getElementById('breath-label').textContent = "To'xtatildi";
    if(mode==='walk'){ const e=document.getElementById('walk-emoji'); if(e) e.classList.remove('bounce'); }
    else { const c=document.getElementById('breath-circle'); if(c) c.style.transform='scale(1)'; }
    btn.textContent = "Qayta boshlash";
    return;
  }
  const pattern = VIEW.breathPattern;
  btn.textContent = "To'xtatish";
  runBreathCycle(pattern, 0, mode);
}
function runBreathCycle(pattern, idx, mode){
  const label = document.getElementById('breath-label');
  if(!label) { BREATH_TIMER=null; return; }
  const phase = pattern[idx % pattern.length];
  label.textContent = phase.label;
  if(mode==='walk'){
    const emoji = document.getElementById('walk-emoji');
    if(emoji){ if(phase.walking) emoji.classList.add('bounce'); else emoji.classList.remove('bounce'); }
  } else {
    const circle = document.getElementById('breath-circle');
    if(circle){
      circle.style.transform = `scale(${phase.scale||1})`;
      circle.style.transition = `transform ${phase.sec}s ease-in-out`;
    }
  }
  BREATH_TIMER = setTimeout(()=> runBreathCycle(pattern, idx+1, mode), phase.sec*1000);
}

  const daysSinceEpoch = Math.floor((Date.now() + 5*3600*1000) / 86400000);

  const start = (daysSinceEpoch * 3) % n;

          <div>
            <div class="profile-name">${p.name || 'Pedagog'}</div>
            <div class="profile-sub">${metaBits.join(' · ') || 'Ma\'lumot kiritilmagan'}</div>
          </div>
          <button class="edit-fab" onclick="go({name:'edit_profile'})">✏️</button>
        </div>
        ${reward ? `<div class="reward-strip">
          <img class="reward-badge-img" src="data:image/svg+xml;utf8,${encodeURIComponent(badgeSvg(reward.level))}" />
          <div><div class="reward-title">${reward.title}</div><div class="reward-note">${reward.note}</div></div>
        </div>` : ''}
      </div>

      <div class="divider-label">Bugungi kun (${fmtDate()})</div>
      <div class="today-grid">
        <div class="today-stat"><div class="today-num">${todayFitnes}</div><div class="today-label">Fitnes / refleksiya</div></div>
        <div class="today-stat"><div class="today-num">${todayCases}</div><div class="today-label">Yechilgan keys</div></div>
        <div class="today-stat"><div class="today-num">${doneCount}</div><div class="today-label">Jami mashqlar</div></div>
        <div class="today-stat"><div class="today-num">${casesCount}</div><div class="today-label">Jami keyslar</div></div>
      </div>

      <div class="divider-label">Diagnostika natijalari</div>
      ${miniCard('Emotsional Intellekt', r.xoll, 'xoll_intro')}
      ${miniCard('Kasbiy charchash', r.mbi, 'mbi_intro')}
      ${miniCard('Stressga bardosh', r.xeym, 'xeym_intro')}

      ${recentCases.length ? `
      <div class="divider-label">Oxirgi yechilgan keyslar</div>
      <div class="card">
        ${recentCases.map(([cid, d])=>{
          const c = CASES.find(x=>x.id===cid);
          if(!c) return '';
          return `<div class="routine-row" style="border-bottom:1px solid var(--line);">
            <div class="routine-icon">${d.correct?'✅':'🔁'}</div>
            <div class="routine-mid"><div class="routine-title" style="font-size:13px;">${c.sarlavha}</div></div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}

function renderEditProfile(){
  const p = STATE.profile;
  const body = `
    ${topbar('Ma\'lumotlarni tahrirlash','', true)}
    <main>
      <div class="card">
        <div class="eyebrow">Ism</div>
        <input id="ep-name" class="field-input" type="text" value="${p.name||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Email</div>
        <input id="ep-email" class="field-input" type="email" value="${p.email||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Yosh</div>
        <input id="ep-age" class="field-input" type="number" value="${p.age||''}"/>
        <div class="eyebrow" style="margin-top:14px;">Pedagogik staj (yil)</div>
        <input id="ep-staj" class="field-input" type="number" value="${p.staj||''}"/>
      </div>
      <button class="btn" onclick="saveEditProfile()">Saqlash</button>
    </main>
    ${bottomNav('profil')}
  `;
  document.getElementById('app').innerHTML = body;
}
function saveEditProfile(){
  const name = document.getElementById('ep-name').value.trim();
  const email = document.getElementById('ep-email').value.trim();
  const age = document.getElementById('ep-age').value.trim();
  const staj = document.getElementById('ep-staj').value.trim();
  if(!name){ alert("Iltimos, ismingizni kiriting"); return; }
  STATE.profile = {name, email, age, staj};
  saveState();
  syncSave();
  go({name:'profil'});
}

/* ---------------- ROUTER ---------------- */
function render(){
  switch(VIEW.name){
    case 'onboarding': return renderOnboarding();
    case 'home': return renderHome();
    case 'xoll_intro': return renderXollIntro();
    case 'xoll_q': return renderXollQuestion(VIEW.idx);
    case 'xoll_result': return renderXollResult();
    case 'mbi_intro': return renderMbiIntro();
    case 'mbi_q': return renderMbiQuestion(VIEW.idx);
    case 'mbi_result': return renderMbiResult();
    case 'xeym_intro': return renderXeymIntro();
    case 'xeym_q': return renderXeymQuestion(VIEW.idx);
    case 'xeym_result': return renderXeymResult();
    case 'fitnes': return renderFitnes();
    case 'fitnes_detail': return renderFitnesDetail(VIEW.id);
    case 'cases': return renderCases();
    case 'case_detail': return renderCaseDetail(VIEW.id);
    case 'profil': return renderProfil();
    case 'routine_edit': return renderRoutineEdit();
    case 'edit_profile': return renderEditProfile();
    default: return renderHome();
  }
}
bootFromCloud();
</script>
</body>
</html>
